<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dieguinni's Projects</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236C63FF'/><text y='.9em' font-size='70' x='12'>🗂</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;
  --surface:#ffffff;
  --surface2:#f0eff9;
  --surface3:#e8e7f2;
  --border:rgba(100,90,200,.08);
  --border2:rgba(100,90,200,.16);
  --text:#18172b;
  --text2:#5c5a7a;
  --text3:#a09dbe;
  --accent:#6C63FF;
  --accent-light:#eeeeff;
  --accent-dark:#4a43cc;
  --accent-glow:rgba(108,99,255,.18);
  --purple:#9B5CF6;
  --purple-light:#f3eeff;
  --purple-text:#6D28D9;
  --amber:#F59E0B;
  --amber-light:#fffbeb;
  --amber-dark:#92400E;
  --blue:#3B82F6;
  --blue-light:#eff6ff;
  --blue-dark:#1D4ED8;
  --red:#EF4444;
  --red-light:#fef2f2;
  --red-dark:#991B1B;
  --green:#10B981;
  --green-light:#ecfdf5;
  --green-dark:#065F46;
  --teal:#14B8A6;
  --teal-light:#f0fdfa;
  --radius:12px;
  --radius-lg:18px;
  --radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(60,50,180,.06),0 1px 2px rgba(60,50,180,.04);
  --shadow:0 4px 16px rgba(60,50,180,.08),0 1px 4px rgba(60,50,180,.04);
  --shadow-lg:0 12px 40px rgba(60,50,180,.12),0 4px 12px rgba(60,50,180,.06);
}
[data-theme="dark"]{
  --bg:#0f0e1a;
  --surface:#19182d;
  --surface2:#221f38;
  --surface3:#2d2a48;
  --border:rgba(140,130,255,.1);
  --border2:rgba(140,130,255,.18);
  --text:#e8e6ff;
  --text2:#9d9bc0;
  --text3:#5e5c80;
  --accent:#7C73FF;
  --accent-light:#1e1a3a;
  --accent-dark:#a89fff;
  --accent-glow:rgba(124,115,255,.2);
  --purple:#A78BFA;
  --purple-light:#1e1535;
  --purple-text:#C4B5FD;
  --amber:#FCD34D;
  --amber-light:#1c1500;
  --amber-dark:#FDE68A;
  --blue:#60A5FA;
  --blue-light:#0c1528;
  --blue-dark:#93C5FD;
  --red:#F87171;
  --red-light:#1c0a0a;
  --red-dark:#FCA5A5;
  --green:#34D399;
  --green-light:#061a12;
  --green-dark:#6EE7B7;
  --teal:#2DD4BF;
  --teal-light:#061918;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow:0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.4);
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}

/* LAYOUT */
.shell{display:flex;min-height:100vh}
.sidebar{width:240px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 1rem 1rem;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;transition:background .3s}
.logo{padding:0 8px;margin-bottom:2rem}
.logo-mark{display:flex;align-items:center;gap:10px}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 12px var(--accent-glow)}
.logo-text{font-family:'Fraunces',serif;font-size:17px;font-weight:300;color:var(--text);line-height:1.2}
.logo-text span{color:var(--accent)}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.04em;margin-top:1px}

.nav-section{margin-bottom:1.5rem}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 10px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);font-size:13px;font-weight:400;color:var(--text2);cursor:pointer;transition:all .18s;border:none;background:none;width:100%;text-align:left;font-family:'Outfit',sans-serif;position:relative}
.nav-item:hover{background:var(--accent-light);color:var(--accent)}
.nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-item.active::before{content:'';position:absolute;left:-1rem;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item i{font-size:17px;opacity:.8}
.nav-item.active i{opacity:1}
.nav-count{margin-left:auto;font-size:11px;background:var(--accent-glow);color:var(--accent);padding:2px 7px;border-radius:99px;font-weight:500}
.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}

/* TOPBAR */
.main{margin-left:240px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.85rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);transition:background .3s}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:15px;font-weight:500;color:var(--text)}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* BUTTONS */
.view-switcher{display:flex;background:var(--surface2);border-radius:var(--radius);padding:3px;gap:2px}
.vs-btn{background:none;border:none;padding:5px 9px;cursor:pointer;color:var(--text3);font-size:15px;border-radius:8px;transition:all .18s}
.vs-btn.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-sm)}
.vs-btn:hover:not(.active){color:var(--text2)}

.btn-primary{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;border:none;border-radius:var(--radius);padding:8px 16px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Outfit',sans-serif;font-weight:500;transition:all .2s;box-shadow:0 4px 14px var(--accent-glow);letter-spacing:.01em}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
.btn-primary:active{transform:translateY(0)}

.btn-ghost{background:none;color:var(--text2);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 13px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Outfit',sans-serif;transition:all .18s}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);background:var(--accent-light)}

.theme-toggle{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;cursor:pointer;color:var(--text2);font-size:16px;display:flex;align-items:center;transition:all .18s}
.theme-toggle:hover{color:var(--accent);border-color:var(--accent)}

.icon-btn{background:none;border:none;cursor:pointer;padding:5px 6px;color:var(--text3);font-size:16px;border-radius:8px;transition:all .15s;line-height:1}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.icon-btn.red:hover{color:var(--red);background:var(--red-light)}

.content{padding:2rem;flex:1}

/* TOPBAR SEARCH */
.topbar-search-wrap{position:relative;display:flex;align-items:center}
.topbar-search-box{display:none;align-items:center;position:relative;gap:6px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:6px 10px 6px 38px;animation:searchExpand .18s ease}
.topbar-search-box.open{display:flex}
@keyframes searchExpand{from{opacity:0;transform:scaleX(.92);transform-origin:right}to{opacity:1;transform:scaleX(1)}}
.topbar-search-input{background:none;border:none;outline:none;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;width:240px}
.topbar-search-input::placeholder{color:var(--text3)}
.search-results{position:absolute;top:calc(100% + 8px);right:0;width:380px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);overflow:hidden;display:none;box-shadow:var(--shadow-lg);z-index:100}
.search-results.open{display:block;animation:popIn .15s ease}
.sr-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;display:flex;align-items:center;gap:10px}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--accent-light)}
.sr-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);min-width:70px}
.sr-name{font-size:13px;color:var(--text);flex:1}
.sr-proj{font-size:11px;color:var(--text3)}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center}
.filter-input,.filter-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;transition:all .18s;box-shadow:var(--shadow-sm)}
.filter-input{flex:1;min-width:160px}
.filter-input::placeholder{color:var(--text3)}
.filter-input:focus,.filter-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.filter-select{cursor:pointer}
.tag-chip{font-size:11px;font-weight:500;padding:4px 12px;border-radius:99px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s}
.tag-chip.active,.tag-chip:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.75rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:all .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.stat-card:nth-child(1)::before{background:linear-gradient(90deg,var(--accent),var(--purple))}
.stat-card:nth-child(2)::before{background:linear-gradient(90deg,var(--green),var(--teal))}
.stat-card:nth-child(3)::before{background:linear-gradient(90deg,var(--purple),var(--accent))}
.stat-card:nth-child(4)::before{background:linear-gradient(90deg,var(--amber),var(--red))}
.stat-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.stat-value{font-size:28px;font-weight:600;color:var(--text);line-height:1}
.stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.08}

/* PROJECT GRID */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.25rem 1.4rem;cursor:pointer;transition:all .22s;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.project-card::after{content:'';position:absolute;inset:0;border-radius:var(--radius-xl);opacity:0;background:linear-gradient(135deg,var(--accent-glow),transparent);transition:opacity .22s;pointer-events:none}
.project-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.project-card:hover::after{opacity:1}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.3;letter-spacing:-.01em}
.card-menu{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.project-card:hover .card-menu{opacity:1}

.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;letter-spacing:.01em}
.badge-personal{background:var(--green-light);color:var(--green-dark)}
.badge-negocio{background:var(--blue-light);color:var(--blue-dark)}
.badge-activo{background:var(--green-light);color:var(--green-dark)}
.badge-pausa{background:var(--amber-light);color:var(--amber-dark)}
.badge-completado{background:var(--teal-light);color:var(--teal)}
.badge-idea{background:var(--purple-light);color:var(--purple-text)}
.badge-alta{background:var(--red-light);color:var(--red-dark)}
.badge-media{background:var(--amber-light);color:var(--amber-dark)}
.badge-baja{background:var(--green-light);color:var(--green-dark)}
.custom-tag-badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

.card-desc{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:14px;flex:1}
.progress-wrap{margin-bottom:12px}
.progress-meta{display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:var(--text3);margin-bottom:5px}
.progress-bar{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:99px;transition:width .5s ease}
.card-bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text3)}
.collabs{display:flex}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#fff;margin-left:-7px}
.avatar:first-child{margin-left:0}

/* KANBAN */
.kanban-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kanban-col{background:var(--surface2);border-radius:var(--radius-lg);padding:14px}
.kanban-col-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.kanban-col-count{font-size:11px;background:var(--surface3);color:var(--text3);padding:2px 8px;border-radius:99px;font-weight:500}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all .18s;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.kanban-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.kanban-card-title{font-size:13px;font-weight:500;margin-bottom:5px}
.kanban-card-meta{font-size:11px;color:var(--text3)}

/* TIMELINE */
.timeline-wrap{overflow-x:auto;padding-bottom:1rem}
.timeline-header{display:flex;margin-bottom:8px;margin-left:180px}
.timeline-month{font-size:11px;font-weight:500;color:var(--text3);flex:none;text-align:center;border-left:1px solid var(--border)}
.timeline-row{display:flex;align-items:center;margin-bottom:8px;height:40px}
.timeline-label{width:180px;flex:none;font-size:12px;font-weight:500;color:var(--text2);padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:color .15s}
.timeline-label:hover{color:var(--accent)}
.timeline-track{flex:1;position:relative;height:100%;border-left:1px solid var(--border)}
.timeline-bar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:99px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;transition:opacity .15s;box-shadow:var(--shadow-sm)}
.timeline-bar:hover{opacity:.85}

/* DETAIL */
.detail-wrap{animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.detail-head{margin-bottom:8px}
.detail-title{font-family:'Fraunces',serif;font-size:30px;font-weight:300;color:var(--text);line-height:1.2;letter-spacing:-.02em}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.detail-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:1.5rem}

.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:2rem}
.ds-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm)}
.ds-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.ds-value{font-size:14px;font-weight:500;color:var(--text)}

/* TABS */
.detail-tabs{display:flex;gap:2px;margin-bottom:1.75rem;background:var(--surface2);padding:4px;border-radius:var(--radius-lg);width:fit-content}
.detail-tab{background:none;border:none;border-radius:var(--radius);padding:7px 14px;font-size:13px;font-weight:400;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .18s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.detail-tab i{font-size:15px}
.detail-tab.active{background:var(--surface);color:var(--accent);font-weight:500;box-shadow:var(--shadow-sm)}
.detail-tab:hover:not(.active){color:var(--text)}

.sec-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:14px}
.sec-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.sec-count{font-size:11px;background:var(--accent-light);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:600}

/* PHASES */
.phases-list{display:flex;flex-direction:column;gap:10px}
.phase-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;display:flex;align-items:flex-start;gap:14px;box-shadow:var(--shadow-sm);transition:all .18s}
.phase-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.phase-num{font-size:12px;font-weight:600;color:var(--text3);min-width:22px;margin-top:2px;background:var(--surface2);width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phase-body{flex:1}
.phase-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;letter-spacing:-.01em}
.phase-desc-text{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:4px}
.phase-dates{font-size:11px;color:var(--text3);font-weight:500}
.phase-comments{margin-top:10px}
.phase-comment{font-size:12px;color:var(--text2);background:var(--surface2);border-radius:8px;padding:6px 10px;margin-bottom:4px;line-height:1.5;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.phase-comment-author{font-weight:600;color:var(--text);margin-right:5px}
.add-comment-wrap{display:flex;gap:6px;margin-top:8px}
.add-comment-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;transition:border-color .15s}
.add-comment-input:focus{border-color:var(--accent)}
.add-comment-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;transition:opacity .15s}
.add-comment-btn:hover{opacity:.85}
.phase-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* PHASE STATUS DROPDOWN */
.phase-status-dropdown{position:relative;display:inline-block}
.phase-status-pill{font-size:11px;font-weight:500;border-radius:99px;padding:5px 11px 5px 9px;cursor:pointer;font-family:'Outfit',sans-serif;border:none;outline:none;transition:all .2s;display:flex;align-items:center;gap:5px;user-select:none;white-space:nowrap}
.phase-status-pill i{font-size:11px;transition:transform .2s}
.phase-status-pill.open i.ti-chevron-down{transform:rotate(180deg)}
.phase-status-pill.pending{background:var(--surface2);color:var(--text2)}
.phase-status-pill.pending:hover{background:var(--surface3)}
.phase-status-pill.active{background:var(--blue-light);color:var(--blue-dark)}
.phase-status-pill.completed{background:var(--green-light);color:var(--green-dark)}
.phase-status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.phase-status-pill.pending .phase-status-dot{background:var(--text3)}
.phase-status-pill.active .phase-status-dot{background:var(--blue)}
.phase-status-pill.completed .phase-status-dot{background:var(--green)}
.status-popup{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:5px;z-index:50;min-width:155px;box-shadow:var(--shadow-lg);display:none}
.status-popup.open{display:block;animation:popIn .15s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.status-option{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);transition:background .12s;font-family:'Outfit',sans-serif}
.status-option:hover{background:var(--accent-light);color:var(--accent)}
.status-option.selected{color:var(--text);background:var(--surface2)}
.status-option-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.so-pending .status-option-dot{background:var(--text3)}
.so-active .status-option-dot{background:var(--blue)}
.so-completed .status-option-dot{background:var(--green)}

/* IDEAS */
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.idea-card{background:linear-gradient(135deg,var(--purple-light),var(--accent-light));border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;position:relative;transition:all .18s;box-shadow:var(--shadow-sm)}
.idea-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.idea-text{font-size:13px;color:var(--purple-text);line-height:1.6;padding-right:22px;font-weight:400}
.idea-del{position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;color:var(--purple);opacity:.35;font-size:14px;transition:opacity .15s;padding:2px;border-radius:4px}
.idea-del:hover{opacity:1;background:var(--red-light);color:var(--red)}

/* NOTES */
.notes-area{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;font-size:14px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;min-height:160px;resize:vertical;line-height:1.7;transition:all .2s;box-shadow:var(--shadow-sm)}
.notes-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.notes-saved{font-size:11px;font-weight:500;color:var(--green);margin-top:6px;opacity:0;transition:opacity .3s}
.notes-saved.show{opacity:1}

/* RESOURCES & TOOLS */
.resources-list,.tools-list{display:flex;flex-direction:column;gap:8px}
.resource-item,.tool-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);transition:all .18s}
.resource-item:hover,.tool-item:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.resource-icon{font-size:18px;color:var(--accent);background:var(--accent-light);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.resource-name,.tool-name{font-size:13px;font-weight:500;flex:1;color:var(--text)}
.resource-link,.tool-link{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;background:var(--accent-light);transition:all .15s}
.resource-link:hover,.tool-link:hover{background:var(--accent);color:#fff}
.tool-phase-tag{font-size:11px;font-weight:500;color:var(--text3);background:var(--surface2);padding:3px 10px;border-radius:99px}
.project-link-tag{font-size:11px;font-weight:500;color:var(--accent);cursor:pointer;background:var(--accent-light);padding:3px 10px;border-radius:99px;transition:all .15s}
.project-link-tag:hover{background:var(--accent);color:#fff}

/* EXPORT BTN */
.export-btn{background:none;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Outfit',sans-serif;transition:all .15s}
.export-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-light)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,8,30,.45);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2rem;width:530px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:fadeUp .2s ease;box-shadow:var(--shadow-lg)}
.modal-title{font-size:17px;font-weight:600;margin-bottom:1.5rem;color:var(--text);letter-spacing:-.01em}
.form-group{margin-bottom:1.1rem}
.form-label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.form-input,.form-textarea,.form-select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 13px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;transition:all .18s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-textarea{min-height:90px;resize:vertical;line-height:1.6}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border)}

/* SHARE */
.share-box{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:8px}
.share-url{font-size:12px;color:var(--text2);flex:1;word-break:break-all}

/* NOTIF */
.notif{position:fixed;bottom:24px;right:24px;background:var(--text);color:var(--bg);border-radius:var(--radius-lg);padding:11px 20px;font-size:13px;font-weight:500;z-index:999;animation:slideUp .22s ease;box-shadow:var(--shadow-lg)}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

/* EMPTY */
.empty{text-align:center;padding:5rem 1rem;color:var(--text3);grid-column:1/-1}
.empty i{font-size:52px;display:block;margin-bottom:16px;opacity:.4}
.empty p{font-size:14px}

/* BRIEF TAB */
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.brief-field{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:10px;transition:all .18s;box-shadow:var(--shadow-sm)}
.brief-field:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.brief-field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.brief-field.full{grid-column:1/-1}
.brief-field-header{display:flex;align-items:center;gap:10px}
.brief-field-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
.brief-field-label{font-size:13px;font-weight:600;color:var(--text)}
.brief-field-hint{font-size:11px;color:var(--text3);margin-top:1px}
.brief-textarea{width:100%;background:transparent;border:none;outline:none;resize:vertical;line-height:1.65;min-height:80px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif}
.brief-textarea::placeholder{color:var(--text3)}
.brief-saved{font-size:11px;font-weight:500;color:var(--green);text-align:right;min-height:16px;opacity:0;transition:opacity .3s}
.brief-saved.show{opacity:1}

/* PHASE DOC */
.phase-doc-wrap{animation:fadeUp .22s ease;max-width:800px;margin:0 auto}
.phase-doc-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;gap:12px}
.phase-doc-breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text3)}
.phase-doc-breadcrumb span{cursor:pointer;transition:color .15s;font-weight:400}
.phase-doc-breadcrumb span:hover{color:var(--accent)}
.phase-doc-breadcrumb i{font-size:12px}
.phase-doc-meta{display:flex;gap:8px;align-items:center;margin-bottom:1.75rem;flex-wrap:wrap}
.phase-doc-status{font-size:12px;font-weight:500;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s}
.phase-doc-status:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.phase-doc-status.completed{background:var(--green-light);color:var(--green-dark);border-color:transparent}
.phase-doc-status.active{background:var(--blue-light);color:var(--blue-dark);border-color:transparent}
.doc-saved{font-size:11px;font-weight:500;color:var(--green);opacity:0;transition:opacity .3s}
.doc-saved.show{opacity:1}

/* EDITOR */
.editor-toolbar{display:flex;align-items:center;gap:2px;padding:7px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:10px;flex-wrap:wrap;position:sticky;top:57px;z-index:5;box-shadow:var(--shadow-sm)}
.tb-btn{background:none;border:none;cursor:pointer;padding:5px 8px;border-radius:8px;color:var(--text2);font-size:15px;transition:all .15s;font-family:'Outfit',sans-serif;line-height:1;display:flex;align-items:center}
.tb-btn:hover{background:var(--accent-light);color:var(--accent)}
.tb-sep{width:1px;height:18px;background:var(--border2);margin:0 5px}
.tb-select{background:none;border:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:'Outfit',sans-serif;padding:4px 8px;border-radius:8px;outline:none}
.tb-select:hover{background:var(--accent-light);color:var(--accent)}
.editor-area{min-height:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2.25rem 3rem;outline:none;font-size:15px;line-height:1.8;color:var(--text);font-family:'Outfit',sans-serif;box-shadow:var(--shadow-sm);transition:border-color .2s}
.editor-area:focus{border-color:var(--accent)}
.editor-area h1{font-family:'Fraunces',serif;font-size:28px;font-weight:300;margin:1.5rem 0 .6rem;color:var(--text);line-height:1.2}
.editor-area h2{font-family:'Fraunces',serif;font-size:21px;font-weight:300;margin:1.25rem 0 .5rem;color:var(--text)}
.editor-area h3{font-size:16px;font-weight:600;margin:1rem 0 .4rem;color:var(--text)}
.editor-area p{margin-bottom:.8rem}
.editor-area ul,.editor-area ol{margin:.5rem 0 .8rem 1.75rem}
.editor-area li{margin-bottom:.3rem}
.editor-area blockquote{border-left:3px solid var(--accent);margin:.9rem 0;padding:.6rem 1.25rem;color:var(--text2);font-style:italic;background:var(--accent-light);border-radius:0 10px 10px 0}
.editor-area a{color:var(--accent);text-decoration:underline}
.editor-area code{background:var(--surface2);padding:2px 7px;border-radius:6px;font-family:monospace;font-size:13px;color:var(--purple)}
.editor-area hr{border:none;border-top:1px solid var(--border2);margin:1.75rem 0}
.editor-area[data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--text3);pointer-events:none}

/* INICIO DASHBOARD */
.inicio-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.inicio-wide{grid-column:1/-1}
.inicio-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;box-shadow:var(--shadow-sm)}
.inicio-card-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.inicio-card-title span{display:flex;align-items:center;gap:6px}
.hoy-greeting{font-family:'Fraunces',serif;font-size:26px;font-weight:300;color:var(--text);margin-bottom:4px}
.hoy-date{font-size:13px;color:var(--text3)}
.hoy-stats{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.hoy-stat{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:var(--radius);padding:8px 14px}
.hoy-stat-num{font-size:20px;font-weight:600;color:var(--text)}
.hoy-stat-label{font-size:11px;color:var(--text3)}
.quick-project{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .15s}
.quick-project:last-child{border-bottom:none}
.quick-project:hover .quick-project-name{color:var(--accent)}
.quick-project-bar{width:3px;height:32px;border-radius:99px;flex-shrink:0}
.quick-project-name{font-size:13px;font-weight:500;flex:1}
.quick-project-pct{font-size:11px;color:var(--text3)}
.mini-progress{height:3px;background:var(--surface2);border-radius:99px;overflow:hidden;width:60px}
.mini-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:99px}
.idea-recent{font-size:12px;color:var(--text2);padding:6px 10px;background:var(--purple-light);border-radius:8px;margin-bottom:5px;line-height:1.4}
.idea-recent:last-child{margin-bottom:0}
.acceso-rapido{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ar-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;background:var(--surface2);border-radius:var(--radius-lg);border:1px solid var(--border);cursor:pointer;transition:all .18s;text-decoration:none;font-family:'Outfit',sans-serif}
.ar-btn:hover{background:var(--accent-light);border-color:var(--accent);transform:translateY(-2px)}
.ar-btn i{font-size:20px;color:var(--accent)}
.ar-btn span{font-size:11px;font-weight:500;color:var(--text2)}
/* TAREAS */
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:all .15s}
.task-item:hover{border-color:var(--border2)}
.task-item.done{opacity:.5}
.task-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;background:none}
.task-check:hover{border-color:var(--accent)}
.task-check.checked{background:var(--accent);border-color:var(--accent)}
.task-check.checked::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.task-text{font-size:13px;flex:1;color:var(--text)}
.task-item.done .task-text{text-decoration:line-through;color:var(--text3)}
.task-phase-tag{font-size:10px;font-weight:500;color:var(--text3);background:var(--surface2);padding:2px 7px;border-radius:99px}
.task-add-wrap{display:flex;gap:8px;margin-top:8px}
.task-add-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;transition:border-color .15s}
.task-add-input:focus{border-color:var(--accent)}
/* FOCUS MODE */
.focus-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;animation:fadeUp .2s ease}
.focus-topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--surface)}
.focus-title{font-family:'Fraunces',serif;font-size:20px;font-weight:300}
.focus-content{flex:1;overflow-y:auto;padding:2rem;max-width:700px;margin:0 auto;width:100%}
/* DIARIO */
.diario-layout{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.diario-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;box-shadow:var(--shadow-sm);position:sticky;top:80px}
.diario-entry-item{padding:8px 10px;border-radius:var(--radius);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.diario-entry-item:hover{background:var(--surface2)}
.diario-entry-item.active{background:var(--accent-light);border-left-color:var(--accent)}
.diario-entry-date{font-size:12px;font-weight:600;color:var(--text)}
.diario-entry-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diario-editor{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2.5rem 3rem;min-height:500px;box-shadow:var(--shadow-sm)}
.diario-entry-title{font-family:'Fraunces',serif;font-size:26px;font-weight:300;color:var(--text);margin-bottom:1.5rem;border:none;outline:none;width:100%;background:none}
.diario-textarea{width:100%;background:none;border:none;outline:none;font-size:14px;line-height:1.8;color:var(--text);font-family:'Outfit',sans-serif;resize:none;min-height:400px}
.diario-textarea::placeholder{color:var(--text3)}
/* METAS */
.metas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.meta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.25rem 1.4rem;box-shadow:var(--shadow-sm);transition:all .2s}
.meta-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.meta-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.meta-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meta-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.meta-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.meta-period{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.meta-period-trimestral{background:var(--blue-light);color:var(--blue-dark)}
.meta-period-anual{background:var(--purple-light);color:var(--purple-text)}
.meta-period-mensual{background:var(--green-light);color:var(--green-dark)}
.meta-progress-wrap{margin:10px 0}
.meta-progress-bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meta-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:99px;transition:width .4s}
.meta-progress-label{font-size:11px;color:var(--text3);margin-top:4px;display:flex;justify-content:space-between}
.meta-linked{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.meta-linked-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all .15s}
.meta-linked-tag:hover{background:var(--accent);color:#fff}
/* PLANTILLAS */
.plantilla-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
.plantilla-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
/* BIBLIOTECA */
.bib-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.bib-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem;box-shadow:var(--shadow-sm);position:sticky;top:80px}
.bib-cat-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'Outfit',sans-serif}
.bib-cat-item:hover{background:var(--surface2);color:var(--text)}
.bib-cat-item.active{background:var(--accent-light);color:var(--accent);font-weight:500}
.bib-cat-count{margin-left:auto;font-size:11px;font-weight:500;background:var(--surface2);color:var(--text3);padding:1px 7px;border-radius:99px}
.bib-cat-item.active .bib-cat-count{background:var(--accent-glow);color:var(--accent)}
.bib-sep{height:1px;background:var(--border);margin:8px 0}
.bib-collection-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'Outfit',sans-serif}
.bib-collection-item:hover{background:var(--surface2);color:var(--text)}
.bib-collection-item.active{color:var(--accent);font-weight:500}
.bib-main{}
.bib-topbar{display:flex;gap:8px;margin-bottom:1.25rem;align-items:center;flex-wrap:wrap}
.bib-search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:9px 14px 9px 38px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none;transition:all .2s;box-shadow:var(--shadow-sm);position:relative}
.bib-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.bib-search-wrap{position:relative;flex:1}
.bib-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.bib-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.bib-filter-chip{font-size:11px;font-weight:500;padding:4px 12px;border-radius:99px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s}
.bib-filter-chip.active,.bib-filter-chip:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

<script>
// ───── SQLite storage layer ─────
let _sqldb=null;
let _SQL=null;
let _fileHandle=null;
let _idbDb=null;
let _persistTimer=null;
let _connectionStatus='disconnected';

function openIDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('prohub_storage',1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
function idbGet(key){
  return new Promise((resolve,reject)=>{
    const tx=_idbDb.transaction('kv','readonly');
    const req=tx.objectStore('kv').get(key);
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
function idbSet(key,value){
  return new Promise((resolve,reject)=>{
    const tx=_idbDb.transaction('kv','readwrite');
    tx.objectStore('kv').put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e.target.error);
  });
}
function ensureSchema(){
  _sqldb.run(`
    CREATE TABLE IF NOT EXISTS projects (id TEXT PRIMARY KEY, name TEXT, category TEXT, status TEXT, priority TEXT, data TEXT, updated_at TEXT);
    CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT);
    CREATE TABLE IF NOT EXISTS diario (id TEXT PRIMARY KEY, date TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS metas (id TEXT PRIMARY KEY, titulo TEXT, periodo TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS plantillas (id TEXT PRIMARY KEY, nombre TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS bib_items (id TEXT PRIMARY KEY, type TEXT, title TEXT, "collection" TEXT, fav INTEGER, data TEXT);
    CREATE TABLE IF NOT EXISTS bib_collections (name TEXT PRIMARY KEY, position INTEGER DEFAULT 0);
  `);
}
function _query(sql,params){
  const stmt=_sqldb.prepare(sql);
  if(params&&params.length)stmt.bind(params);
  const rows=[];
  while(stmt.step())rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}
function _insertProject(p){
  _sqldb.run('INSERT OR REPLACE INTO projects VALUES (?,?,?,?,?,?,?)',
    [p.id,p.name||'',p.category||'',p.status||'',p.priority||'',JSON.stringify(p),new Date().toISOString()]);
}
function _insertDiario(d){
  _sqldb.run('INSERT OR REPLACE INTO diario VALUES (?,?,?)',[d.id,d.date||'',JSON.stringify(d)]);
}
function _insertMeta(m){
  _sqldb.run('INSERT OR REPLACE INTO metas VALUES (?,?,?,?)',[m.id,m.titulo||'',m.periodo||'',JSON.stringify(m)]);
}
function _insertPlantilla(p){
  _sqldb.run('INSERT OR REPLACE INTO plantillas VALUES (?,?,?)',[p.id,p.nombre||'',JSON.stringify(p)]);
}
function _insertBibItem(it){
  _sqldb.run('INSERT OR REPLACE INTO bib_items VALUES (?,?,?,?,?,?)',
    [it.id,it.type||'',it.title||'',it.collection||'',it.fav?1:0,JSON.stringify(it)]);
}
function seedDefaults(){
  defaultProjects().forEach(_insertProject);
  defaultPlantillas().forEach(_insertPlantilla);
  defaultBibItems().forEach(_insertBibItem);
  ['Stack IA','Diseño','Productividad'].forEach((c,i)=>
    _sqldb.run('INSERT OR REPLACE INTO bib_collections VALUES (?,?)',[c,i]));
  _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',['layoutView',JSON.stringify('grid')]);
}
function migrateFromLocalStorage(){
  let migrated=false;
  try{
    const raw=localStorage.getItem('prohub_v3');
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed.projects&&Array.isArray(parsed.projects)){
        parsed.projects.forEach(_insertProject);
        if(parsed.settings){
          for(const [k,v] of Object.entries(parsed.settings))
            _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',[k,JSON.stringify(v)]);
        }
        migrated=true;
      }
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem('prohub_extras_v1');
    if(raw){
      const parsed=JSON.parse(raw);
      (parsed.diario||[]).forEach(_insertDiario);
      (parsed.metas||[]).forEach(_insertMeta);
      (parsed.plantillas||[]).forEach(_insertPlantilla);
      migrated=true;
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem('prohub_bib_v1');
    if(raw){
      const parsed=JSON.parse(raw);
      (parsed.items||[]).forEach(_insertBibItem);
      (parsed.collections||[]).forEach((c,i)=>
        _sqldb.run('INSERT OR REPLACE INTO bib_collections VALUES (?,?)',[c,i]));
      migrated=true;
    }
  }catch(e){}
  return migrated;
}
async function initStorage(){
  _idbDb=await openIDB();
  _SQL=await initSqlJs();
  try{
    const handle=await idbGet('fileHandle');
    if(handle){
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted')_fileHandle=handle;
    }
  }catch(e){}
  let bytes=null;
  if(_fileHandle){
    try{
      const f=await _fileHandle.getFile();
      bytes=new Uint8Array(await f.arrayBuffer());
      _connectionStatus='connected';
    }catch(e){_fileHandle=null;}
  }
  if(!bytes){
    try{bytes=await idbGet('dbBytes');}catch(e){}
    if(bytes&&bytes.byteLength>0&&!_fileHandle)_connectionStatus='cached';
  }
  if(bytes&&bytes.byteLength>0){
    _sqldb=new _SQL.Database(bytes);
    ensureSchema();
  }else{
    _sqldb=new _SQL.Database();
    ensureSchema();
    const migrated=migrateFromLocalStorage();
    if(!migrated)seedDefaults();
    else setTimeout(()=>notif('Datos migrados desde localStorage ✓'),800);
  }
}
function load(){
  const projects=_query('SELECT data FROM projects ORDER BY updated_at DESC').map(r=>JSON.parse(r.data));
  const settings={};
  for(const r of _query('SELECT key, value FROM settings')){
    try{settings[r.key]=JSON.parse(r.value);}catch(e){}
  }
  return{projects,settings};
}
function save(d){
  if(!_sqldb)return;
  _sqldb.run('BEGIN');
  try{
    _sqldb.run('DELETE FROM projects');
    (d.projects||[]).forEach(_insertProject);
    _sqldb.run('DELETE FROM settings');
    for(const [k,v] of Object.entries(d.settings||{}))
      _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',[k,JSON.stringify(v)]);
    _sqldb.run('COMMIT');
  }catch(e){_sqldb.run('ROLLBACK');throw e;}
  schedulePersist();
}
function schedulePersist(){
  clearTimeout(_persistTimer);
  _persistTimer=setTimeout(persistNow,300);
}
async function persistNow(){
  if(!_sqldb)return;
  try{
    const bytes=_sqldb.export();
    await idbSet('dbBytes',bytes);
    if(_fileHandle){
      try{
        const writable=await _fileHandle.createWritable();
        await writable.write(bytes);
        await writable.close();
        if(_connectionStatus!=='connected'){
          _connectionStatus='connected';
          updateConnectionUI();
        }
      }catch(e){
        _fileHandle=null;
        _connectionStatus='cached';
        updateConnectionUI();
        notif('No se pudo escribir el archivo .db — guardando solo en caché');
      }
    }
  }catch(e){console.error('Persist failed',e);}
}
async function connectDbFile(){
  if(!_SQL){notif('Cargando base de datos, espera un momento…');return;}
  if(!('showOpenFilePicker' in window)){
    notif('Tu navegador no soporta acceso directo. Usa Chrome/Edge o el botón "Importar .db".');
    return;
  }
  try{
    const [h]=await window.showOpenFilePicker({
      types:[{description:'SQLite database',accept:{'application/x-sqlite3':['.db','.sqlite','.sqlite3']}}]
    });
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted')return notif('Permiso denegado');
    const f=await h.getFile();
    const bytes=new Uint8Array(await f.arrayBuffer());
    if(bytes.byteLength>0){
      _sqldb=new _SQL.Database(bytes);
      ensureSchema();
    }
    _fileHandle=h;
    try{await idbSet('fileHandle',h);}catch(e){}
    _connectionStatus='connected';
    db=load();extras=loadExtras();bib=loadBib();
    layoutView=db.settings?.layoutView||'grid';
    updateConnectionUI();render();
    notif('Conectado a '+h.name+' ✓');
    schedulePersist();
  }catch(e){
    if(e.name!=='AbortError')notif('Error al conectar: '+e.message);
  }
}
async function saveDbAs(){
  if(!_sqldb){notif('Cargando base de datos, espera un momento…');return;}
  if(!('showSaveFilePicker' in window)){
    downloadDbFile();
    return;
  }
  try{
    const h=await window.showSaveFilePicker({
      suggestedName:'prohub.db',
      types:[{description:'SQLite database',accept:{'application/x-sqlite3':['.db']}}]
    });
    _fileHandle=h;
    try{await idbSet('fileHandle',h);}catch(e){}
    _connectionStatus='connected';
    updateConnectionUI();
    await persistNow();
    notif('Guardado como '+h.name+' ✓');
  }catch(e){
    if(e.name!=='AbortError')notif('Error al guardar: '+e.message);
  }
}
function downloadDbFile(){
  if(!_sqldb)return;
  const bytes=_sqldb.export();
  const blob=new Blob([bytes],{type:'application/x-sqlite3'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='prohub-'+new Date().toISOString().slice(0,10)+'.db';
  a.click();
  notif('Descargado ✓');
}
function importDbFile(input){
  if(!_SQL){notif('Cargando base de datos, espera un momento…');input.value='';return;}
  const file=input.files[0];
  if(!file)return;
  if(!confirm('¿Reemplazar la base de datos actual con '+file.name+'?')){input.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const bytes=new Uint8Array(e.target.result);
      _sqldb=new _SQL.Database(bytes);
      ensureSchema();
      db=load();extras=loadExtras();bib=loadBib();
      layoutView=db.settings?.layoutView||'grid';
      schedulePersist();render();
      notif('Base de datos importada ✓');
    }catch(err){notif('Error: archivo .db inválido');}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
async function disconnectDbFile(){
  _fileHandle=null;
  try{await idbSet('fileHandle',null);}catch(e){}
  _connectionStatus='cached';
  updateConnectionUI();
  notif('Desconectado — datos solo en caché del navegador');
}
function updateConnectionUI(){
  const el=document.getElementById('db-status');
  if(el){
    if(_connectionStatus==='connected'){
      const name=_fileHandle?.name||'prohub.db';
      el.innerHTML=`<i class="ti ti-database-check" style="color:var(--green);font-size:14px"></i><span style="color:var(--green);font-weight:500">${name}</span>`;
      el.title='Cambios guardados automáticamente al archivo';
    }else if(_connectionStatus==='cached'){
      el.innerHTML=`<i class="ti ti-database" style="color:var(--amber);font-size:14px"></i><span style="color:var(--amber)">Solo caché</span>`;
      el.title='Datos en caché del navegador. Conecta un archivo .db para persistencia portable.';
    }else{

function renderTimeline(){
  const projects=db.projects.filter(p=>p.deadline);
  if(!projects.length)return`<div class="empty"><i class="ti ti-timeline"></i><p>Ningún proyecto tiene fecha límite asignada.</p></div>`;
  const dates=projects.flatMap(p=>[new Date(p.deadline)]);
  const minDate=new Date(Math.min(...projects.map(p=>new Date(p.deadline))));
  const maxDate=new Date(Math.max(...dates));
  minDate.setDate(1); maxDate.setMonth(maxDate.getMonth()+1); maxDate.setDate(1);
  const totalDays=(maxDate-minDate)/(1000*60*60*24);
  const months=[];
  let d=new Date(minDate);
  while(d<maxDate){months.push(new Date(d));d.setMonth(d.getMonth()+1)}
  const monthW=Math.max(60,Math.floor(700/months.length));
  const colors=['#1D9E75','#534AB7','#185FA5','#854F0B','#993C1D','#3B6D11'];
  const hdrs=months.map(m=>`<div class="timeline-month" style="width:${monthW}px">${m.toLocaleDateString('es-CL',{month:'short',year:'2-digit'})}</div>`).join('');
  const rows=projects.map((p,i)=>{
    const end=new Date(p.deadline+'T00:00:00');
    const start=new Date(end);start.setMonth(start.getMonth()-Math.max(1,p.phases.length));
    const s=Math.max(0,(start-minDate)/(maxDate-minDate)*100);
    const e=Math.min(100,(end-minDate)/(maxDate-minDate)*100);
    const w=Math.max(2,e-s);
    const color=colors[i%colors.length];
    return`<div class="timeline-row">
      <div class="timeline-label" onclick="setView('project-detail','${p.id}')" title="${p.name}">${p.name}</div>
      <div class="timeline-track">
        <div class="timeline-bar" style="left:${s}%;width:${w}%;background:${color}" onclick="setView('project-detail','${p.id}')" title="${p.name} — ${p.deadline}">${p.name}</div>
      </div>
    </div>`;
  }).join('');
  return`<div class="timeline-wrap"><div class="timeline-header">${hdrs}</div>${rows}</div>`;
}

let _docTimer=null;
function autoSaveDoc(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const editor=document.getElementById('phase-editor');
  if(!editor)return;
  ph.doc=editor.innerHTML;
  save(db);
  clearTimeout(_docTimer);
  const el=document.getElementById('doc-saved');
  if(el){el.classList.add('show');_docTimer=setTimeout(()=>el.classList.remove('show'),1500)}
}

function cyclePhaseInDoc(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  ph.status={pending:'active',active:'completed',completed:'pending'}[ph.status]||'pending';
  save(db);
  // re-render only the meta part without losing editor content
  const content=document.getElementById('phase-editor')?.innerHTML||'';
  render();
  setTimeout(()=>{const ed=document.getElementById('phase-editor');if(ed)ed.innerHTML=content;},30);
}

function execCmd(cmd,val=null){
  document.getElementById('phase-editor')?.focus();
  document.execCommand(cmd,false,val);
}

function insertBlockquote(){
  document.getElementById('phase-editor')?.focus();
  document.execCommand('formatBlock',false,'blockquote');
}

function insertHr(){
  document.getElementById('phase-editor')?.focus();
  document.execCommand('insertHTML',false,'<hr>');
}

function insertLink(){
  const url=prompt('URL del enlace:');
  if(url){document.getElementById('phase-editor')?.focus();document.execCommand('createLink',false,url);}
}

function exportPhaseDoc(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const editor=document.getElementById('phase-editor');
  const html=editor?editor.innerHTML:(ph.doc||'');
  // convert basic html to markdown-ish plain text
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const text=tmp.innerText||tmp.textContent||'';
  const full=`# ${ph.name}\n**Proyecto:** ${p.name}\n**Estado:** ${{pending:'Pendiente',active:'En curso',completed:'Completado'}[ph.status]||ph.status}\n${ph.startDate?'**Inicio:** '+ph.startDate:''}${ph.endDate?' **Fin:** '+ph.endDate:''}\n\n---\n\n${text}\n\n---\nExportado el ${new Date().toLocaleDateString('es-CL')}`;
  const blob=new Blob([full],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${p.name}-${ph.name}.txt`.replace(/\s+/g,'-');
  a.click();
  notif('Exportado ✓');
}

// GLOBAL SEARCH
let _gsResults=[];
function toggleTopbarSearch(){
  const box=document.getElementById('topbar-search-box');
  const isOpen=box?.classList.contains('open');
  if(isOpen){closeTopbarSearch();}
  else{box?.classList.add('open');setTimeout(()=>document.getElementById('topbar-search-input')?.focus(),50);}
}
function closeTopbarSearch(){
  const box=document.getElementById('topbar-search-box');
  box?.classList.remove('open');
  const inp=document.getElementById('topbar-search-input');
  if(inp)inp.value='';
  _globalSearch='';_gsResults=[];
  hideSearchResults();
}
function handleGlobalSearch(val){
  _globalSearch=val;
  if(!val.trim()){_gsResults=[];hideSearchResults();return}
  const q=val.toLowerCase();
  const results=[];
  db.projects.forEach(p=>{
    if(p.name.toLowerCase().includes(q))results.push({type:'Proyecto',name:p.name,proj:p.name,pid:p.id,tab:null});
    p.ideas.forEach(idea=>{if(idea.toLowerCase().includes(q))results.push({type:'Idea',name:idea,proj:p.name,pid:p.id,tab:'ideas'})});
    p.phases.forEach(ph=>{if(ph.name.toLowerCase().includes(q))results.push({type:'Fase',name:ph.name,proj:p.name,pid:p.id,tab:'fases'})});
    p.tools.forEach(t=>{if(t.name.toLowerCase().includes(q))results.push({type:'Herramienta',name:t.name,proj:p.name,pid:p.id,tab:'herramientas'})});
    (p.resources||[]).forEach(r=>{if(r.name.toLowerCase().includes(q))results.push({type:'Recurso',name:r.name,proj:p.name,pid:p.id,tab:'recursos'})});
  });
  _gsResults=results.slice(0,8);
  showSearchResults();
}
function showSearchResults(){
  const el=document.getElementById('search-results');
  if(!el)return;
  if(!_gsResults.length&&!_globalSearch){el.classList.remove('open');return}
  if(!_gsResults.length){el.innerHTML='<div class="sr-item"><span class="sr-name" style="color:var(--text3)">Sin resultados</span></div>';el.classList.add('open');return}
  el.innerHTML=_gsResults.map((r,i)=>`<div class="sr-item" onmousedown="goToResult(${i})"><span class="sr-type">${r.type}</span><span class="sr-name">${r.name}</span><span class="sr-proj">${r.proj}</span></div>`).join('');
  el.classList.add('open');
}
function hideSearchResults(){const el=document.getElementById('search-results');if(el)el.classList.remove('open')}
function goToResult(i){
  const r=_gsResults[i];
  closeTopbarSearch();
  setView('project-detail',r.pid);
  if(r.tab){activeDetailTab=r.tab;render()}
}

function saveNew(){

  db.projects.unshift({
    id:'p'+Date.now(),name,

    status:document.getElementById('fs').value,
    priority:document.getElementById('fp').value,

    `## Fases`,
    ...p.phases.map((ph,i)=>`${i+1}. [${ph.status==='completed'?'x':ph.status==='active'?'~':' '}] ${ph.name}${ph.desc?' — '+ph.desc:''}`),``,

function importBackup(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.projects||!Array.isArray(parsed.projects))throw new Error('Formato inválido');
      if(!confirm(`¿Importar backup? Esto reemplazará todos tus datos actuales (${db.projects.length} proyectos) con los del archivo (${parsed.projects.length} proyectos).`)){input.value='';return;}
      db={projects:parsed.projects,settings:parsed.settings||{}};
      save(db);
      if(parsed.extras){extras={diario:parsed.extras.diario||[],metas:parsed.extras.metas||[],plantillas:parsed.extras.plantillas||[]};saveExtras();}
      if(parsed.bib){bib={items:parsed.bib.items||[],collections:parsed.bib.collections||[]};saveBib();}
      setView('dashboard');
      notif(`Backup importado — ${parsed.projects.length} proyectos cargados ✓`);
    }catch(err){
      notif('Error: el archivo no es un backup válido');
    }
    input.value='';
  };
  reader.readAsText(file);
}
function clearData(){

function loadExtras(){
  const diario=_query('SELECT data FROM diario ORDER BY date DESC').map(r=>JSON.parse(r.data));
  const metas=_query('SELECT data FROM metas').map(r=>JSON.parse(r.data));
  const plantillas=_query('SELECT data FROM plantillas').map(r=>JSON.parse(r.data));
  return{diario,metas,plantillas};
}
function saveExtras(){
  if(!_sqldb)return;
  _sqldb.run('BEGIN');
  try{
    _sqldb.run('DELETE FROM diario');(extras.diario||[]).forEach(_insertDiario);
    _sqldb.run('DELETE FROM metas');(extras.metas||[]).forEach(_insertMeta);
    _sqldb.run('DELETE FROM plantillas');(extras.plantillas||[]).forEach(_insertPlantilla);
    _sqldb.run('COMMIT');
  }catch(e){_sqldb.run('ROLLBACK');throw e;}
  schedulePersist();
}

function renderDiario(){
  const entries=[...extras.diario].sort((a,b)=>b.date.localeCompare(a.date));
  if(!_diarioActive&&entries.length)_diarioActive=entries[0].id;
  const active=extras.diario.find(e=>e.id===_diarioActive);

function newDiarioEntry(){
  const today=new Date().toISOString().slice(0,10);
  const existing=extras.diario.find(e=>e.date===today);
  if(existing){_diarioActive=existing.id;render();return;}
  const entry={id:'d'+Date.now(),date:today,title:'',content:''};
  extras.diario.unshift(entry);
  _diarioActive=entry.id;
  saveExtras();render();
}
function saveDiarioField(id,field,val){
  const e=extras.diario.find(e=>e.id===id);
  if(!e)return;
  e[field]=val;
  saveExtras();
  clearTimeout(_diarioTimer);
  const el=document.getElementById('diario-saved');
  if(el){el.style.opacity='1';_diarioTimer=setTimeout(()=>el.style.opacity='0',1500);}
}
function deleteDiarioEntry(id){
  if(!confirm('¿Eliminar esta entrada?'))return;
  extras.diario=extras.diario.filter(e=>e.id!==id);
  _diarioActive=extras.diario[0]?.id||null;
  saveExtras();render();
}
function formatDate(d){
  if(!d)return'';
  return new Date(d+'T00:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function saveMeta(editId){

  const data={titulo,desc:document.getElementById('m-desc').value.trim(),periodo:document.getElementById('m-periodo').value,categoria:document.getElementById('m-cat').value,progreso:parseInt(document.getElementById('m-prog').value)||0,proyectos:selProjs};
  if(editId){const m=extras.metas.find(x=>x.id===editId);Object.assign(m,data);}
  else{extras.metas.push({id:'meta'+Date.now(),color:'var(--accent-light)',...data});}
  saveExtras();closeModal();render();notif(editId?'Meta actualizada ✓':'Meta creada ✓');

function deleteMeta(id){

function renderTareasSection(p){
  const allTasks=p.phases.flatMap(ph=>(ph.tasks||[]).map(t=>({...t,phaseName:ph.name,phaseId:ph.id})));
  const pending=allTasks.filter(t=>!t.done);
  const done=allTasks.filter(t=>t.done);
  return`<div class="section">
    <div class="sec-head">
      <div class="sec-title"><i class="ti ti-checkbox" style="color:var(--green)"></i> Tareas <span class="sec-count">${pending.length} pendientes</span></div>
    </div>
    <div class="task-list">
      ${pending.map(t=>renderTaskItem(p.id,t)).join('')}
      ${done.length?`<div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px">Completadas (${done.length})</div>${done.map(t=>renderTaskItem(p.id,t)).join('')}`:''}
    </div>
    <div class="task-add-wrap">
      <select id="task-phase-sel-${p.id}" class="filter-select" style="font-size:12px;padding:7px 10px">
        ${p.phases.map(ph=>`<option value="${ph.id}">${ph.name}</option>`).join('')}
      </select>
      <input class="task-add-input" id="task-input-${p.id}" placeholder="Nueva tarea..." onkeydown="if(event.key==='Enter')addTask('${p.id}')">
      <button class="btn-primary" style="font-size:12px;padding:7px 14px" onclick="addTask('${p.id}')"><i class="ti ti-plus"></i> Añadir</button>
    </div>
  </div>`;
}
function renderTaskItem(pid,t){
  return`<div class="task-item ${t.done?'done':''}">
    <div class="task-check ${t.done?'checked':''}" onclick="toggleTask('${pid}','${t.phaseId}','${t.id}')"></div>
    <span class="task-text">${t.text}</span>
    ${t.phaseName?`<span class="task-phase-tag">${t.phaseName}</span>`:''}
    <button class="icon-btn red" onclick="deleteTask('${pid}','${t.phaseId}','${t.id}')"><i class="ti ti-x"></i></button>
  </div>`;
}
function addTask(pid){
  const p=db.projects.find(pr=>pr.id===pid);
  const input=document.getElementById('task-input-'+pid);
  const phSel=document.getElementById('task-phase-sel-'+pid);
  const text=input?.value.trim();
  if(!text)return notif('Escribe el texto de la tarea');
  const phId=phSel?.value;
  const ph=p.phases.find(ph=>ph.id===phId)||p.phases[0];
  if(!ph)return notif('El proyecto no tiene fases');
  if(!ph.tasks)ph.tasks=[];
  ph.tasks.push({id:'t'+Date.now(),text,done:false});
  save(db);render();
}
function toggleTask(pid,phid,tid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const t=ph?.tasks?.find(t=>t.id===tid);
  if(t){t.done=!t.done;save(db);render();}
}
function deleteTask(pid,phid,tid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  if(ph?.tasks)ph.tasks=ph.tasks.filter(t=>t.id!==tid);
  save(db);render();
}

      </div>
    </div>`;
}
function closeFocusMode(){document.getElementById('modal-root').innerHTML='';_focusProject=null;}
function addFocusTask(pid){
  const p=db.projects.find(pr=>pr.id===pid);

  if(!text)return notif('Escribe el texto de la tarea');

function loadBib(){
  const items=_query('SELECT data FROM bib_items').map(r=>JSON.parse(r.data));
  const collections=_query('SELECT name FROM bib_collections ORDER BY position').map(r=>r.name);
  return{items,collections};
}
function saveBib(){
  if(!_sqldb)return;
  _sqldb.run('BEGIN');
  try{
    _sqldb.run('DELETE FROM bib_items');(bib.items||[]).forEach(_insertBibItem);
    _sqldb.run('DELETE FROM bib_collections');
    (bib.collections||[]).forEach((c,i)=>
      _sqldb.run('INSERT OR REPLACE INTO bib_collections VALUES (?,?)',[c,i]));
    _sqldb.run('COMMIT');
  }catch(e){_sqldb.run('ROLLBACK');throw e;}
  schedulePersist();
}

function renderBiblioteca(){
  let items=bib.items.filter(it=>{

    const mf=!_bibFavOnly||it.fav;
    const mcol=!_bibCollection||it.collection===_bibCollection;
    const mt=!_bibTag||(it.tags||[]).includes(_bibTag);

  else if(_bibSort==='rating')items=[...items].sort((a,b)=>(b.rating||0)-(a.rating||0));

  Object.keys(catConfig).forEach(k=>counts[k]=k==='all'?bib.items.length:bib.items.filter(i=>i.type===k).length);

    <!-- MAIN -->

        ${it.price?`<div style="margin-top:1rem"><div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Precio</div><span class="bib-price ${it.price==='free'?'bib-price-free':it.type==='freemium'?'bib-price-freemium':'bib-price-paid'}" style="font-size:13px;padding:4px 12px">${{free:'Gratuito',freemium:'Freemium',paid:'De pago'}[it.price]||it.price}</span></div>`:''}
      </div>
      <div class="bib-detail-footer">
        ${isPromptOrSnippet?`<button class="btn-primary" onclick="copyBibItem('${it.id}')"><i class="ti ti-copy"></i> Copiar</button>`:''}
        ${hasLink?`<a href="${allLinks[0]?.url}" target="_blank" class="btn-primary" style="text-decoration:none"><i class="ti ti-external-link"></i> ${allLinks[0]?.label||'Abrir'}</a>`:''}
        <button class="btn-ghost" onclick="openBibModal('${it.id}')"><i class="ti ti-edit"></i> Editar</button>
        <button class="btn-ghost" style="margin-left:auto;color:var(--red);border-color:var(--red)" onclick="deleteBibItem('${it.id}')"><i class="ti ti-trash"></i></button>
      </div>
    </div>
  </div>`;
}

function highlightVars(text){
  return text.replace(/\[([^\]]+)\]/g,'<span class="bib-var">[$1]</span>');
}

function addBibLinkRow(){
  const list=document.getElementById('bib-links-list');
  if(!list)return;
  const i=list.children.length;
  const row=document.createElement('div');
  row.style.cssText='display:flex;gap:6px;align-items:center';
  row.id='bib-link-row-'+i;
  row.innerHTML=`
    <input placeholder="Nombre (ej. Demo)" style="flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none" class="bib-link-label" value="">
    <input placeholder="https://..." style="flex:2;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none" class="bib-link-url" value="">
    <button onclick="removeBibLinkRow(this)" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px;border-radius:6px;flex-shrink:0" onmouseover="this.style.color='var(--red)'" onmouseout="this.style.color='var(--text3)'"><i class="ti ti-x"></i></button>`;
  list.appendChild(row);
  row.querySelector('.bib-link-label').focus();
}
function removeBibLinkRow(btn){
  const row=btn.closest('[id^="bib-link-row-"]');
  const list=document.getElementById('bib-links-list');
  if(list&&list.children.length>1)row?.remove();
  else if(row){
    row.querySelectorAll('input').forEach(i=>i.value='');
  }
}
function collectBibLinks(){
  const rows=document.querySelectorAll('#bib-links-list [id^="bib-link-row-"]');
  const links=[];
  rows.forEach(row=>{
    const label=row.querySelector('.bib-link-label')?.value.trim()||'';
    const url=row.querySelector('.bib-link-url')?.value.trim()||'';
    if(url)links.push({label,url});
  });
  return links;
}

function openBibDetail(id){_bibDetail=id;render();}
function closeBibDetail(){_bibDetail=null;render();}

function toggleBibFav(id){
  const it=bib.items.find(i=>i.id===id);
  if(it){it.fav=!it.fav;saveBib();render();}
}

function copyBibItem(id){
  const it=bib.items.find(i=>i.id===id);
  if(!it||!it.prompt)return;
  navigator.clipboard.writeText(it.prompt).then(()=>{
        const btn=document.getElementById('bcb-'+id);
    if(btn){btn.classList.add('copied');btn.innerHTML='<i class="ti ti-check"></i> Copiado';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<i class="ti ti-copy"></i> Copiar';},2000);}
    notif('Copiado al portapapeles ✓');
  }).catch(()=>notif('Error al copiar'));
}

function deleteBibItem(id){
  if(!confirm('¿Eliminar este recurso?'))return;
  bib.items=bib.items.filter(i=>i.id!==id);
  if(_bibDetail===id)_bibDetail=null;
  saveBib();render();notif('Eliminado');
}

function addCollection(){
  const name=prompt('Nombre de la nueva colección:');
  if(!name||!name.trim())return;
  bib.collections.push(name.trim());
  saveBib();render();notif('Colección creada ✓');
}

function exportBib(){
  const blob=new Blob([JSON.stringify(bib,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`biblioteca-${new Date().toISOString().slice(0,10)}.json`;
  a.click();notif('Biblioteca exportada ✓');
}

function importBib(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.items||!Array.isArray(parsed.items))throw new Error();
      if(!confirm(`¿Importar biblioteca? Se reemplazarán tus ${bib.items.length} recursos actuales con ${parsed.items.length} del archivo.`)){input.value='';return;}
      bib=parsed;saveBib();render();notif(`Biblioteca importada — ${parsed.items.length} recursos ✓`);
    }catch{notif('Error: archivo inválido');}
    input.value='';
  };
  reader.readAsText(file);
}

            <input placeholder="Nombre (ej. Documentación)" style="flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 10px;font-size:13px;color:var(--text);font-family:'Outfit',sans-serif;outline:none" class="bib-link-label" value="${l.label||''}">

          </div>`).join('')}

function updateBibForm(){
  const type=document.getElementById('bib-type')?.value;
  const isPS=type==='prompt'||type==='snippet';
  const isLink=true;
  document.getElementById('bib-prompt-group').style.display=isPS?'':'none';
  document.getElementById('bib-link-group').style.display=isLink?'':'none';
  document.getElementById('bib-model-group').style.display=type==='prompt'?'':'none';
  document.getElementById('bib-price-group').style.display=type==='herramienta'?'':'none';
}

function saveBibItem(editId){
  const title=document.getElementById('bib-title')?.value.trim();
  if(!title)return notif('El título es obligatorio');
  const tags=document.getElementById('bib-tags')?.value;
  const data={
    type:document.getElementById('bib-type').value,
    title,
    desc:document.getElementById('bib-desc').value.trim(),
    prompt:document.getElementById('bib-prompt')?.value.trim()||'',
    link:document.getElementById('bib-link')?.value.trim()||'',
    links:collectBibLinks(),
    model:document.getElementById('bib-model')?.value||'',
    price:document.getElementById('bib-price')?.value||'',
    collection:document.getElementById('bib-collection').value,
    tags:tags?tags.split(',').map(t=>t.trim()).filter(Boolean):[],
  };
  if(editId){
    const it=bib.items.find(i=>i.id===editId);
    Object.assign(it,data);
  } else {
    bib.items.push({id:'b'+Date.now(),fav:false,...data});
  }
  saveBib();closeModal();render();notif(editId?'Recurso actualizado ✓':'Recurso añadido ✓');
}
