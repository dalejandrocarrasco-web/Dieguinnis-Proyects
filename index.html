// GLOBAL SEARCH
let _gsResults=[];
function toggleTopbarSearch(){
  const box=document.getElementById('topbar-search-box');
  const isOpen=box?.classList.contains('open');
  if(isOpen){closeTopbarSearch();}
  else{box?.classList.add('open');setTimeout(()=>document.getElementById('topbar-search-input')?.focus(),50);}
}
function closeTopbarSearch(){
  const box=document.getElementById('topbar-search-box');
  box?.classList.remove('open');
  const inp=document.getElementById('topbar-search-input');
  if(inp)inp.value='';
  _globalSearch='';_gsResults=[];
  hideSearchResults();
}
function handleGlobalSearch(val){
  _globalSearch=val;
  if(!val.trim()){_gsResults=[];hideSearchResults();return}
  const q=val.toLowerCase();
  const results=[];
  db.projects.forEach(p=>{
    if(p.name.toLowerCase().includes(q))results.push({type:'Proyecto',name:p.name,proj:p.name,pid:p.id,tab:null});
    p.ideas.forEach(idea=>{if(idea.toLowerCase().includes(q))results.push({type:'Idea',name:idea,proj:p.name,pid:p.id,tab:'ideas'})});
    p.phases.forEach(ph=>{if(ph.name.toLowerCase().includes(q))results.push({type:'Fase',name:ph.name,proj:p.name,pid:p.id,tab:'fases'})});
    p.tools.forEach(t=>{if(t.name.toLowerCase().includes(q))results.push({type:'Herramienta',name:t.name,proj:p.name,pid:p.id,tab:'fases'})});
    (p.resources||[]).forEach(r=>{if(r.name.toLowerCase().includes(q))results.push({type:'Recurso',name:r.name,proj:p.name,pid:p.id,tab:'fases'})});
  });
  _gsResults=results.slice(0,8);
  showSearchResults();
}
function showSearchResults(){
  const el=document.getElementById('search-results');
  if(!el)return;
  if(!_gsResults.length&&!_globalSearch){el.innerHTML='';return}
  if(!_gsResults.length){el.innerHTML='<div class="si2"><span style="color:var(--text3);font-size:13px">Sin resultados para esa búsqueda.</span></div>';return}
  const groups={};
  _gsResults.forEach((r,i)=>{if(!groups[r.type])groups[r.type]=[];groups[r.type].push({...r,i});});
  el.innerHTML=Object.entries(groups).map(([type,items])=>`
    <div class="sg">${type}</div>
    ${items.map(r=>`<div class="si2" onmousedown="goToResult(${r.i})">
      <span class="icon">${type==='Proyecto'?'folder_open':type==='Idea'?'lightbulb':type==='Fase'?'checklist':'build'}</span>
      <div style="flex:1;min-width:0"><div style="font-size:13px;color:var(--text)">${r.name}</div><div style="font-size:11px;color:var(--text3)">${r.proj}</div></div>
    </div>`).join('')}`).join('');
}
function hideSearchResults(){const el=document.getElementById('search-results');if(el)el.innerHTML=''}
function goToResult(i){
  const r=_gsResults[i];
  closeSearch();
  setView('project-detail',r.pid);
  if(r.tab){activeDetailTab=r.tab;render()}
}

  // ── TRANSACCIÓN ──
  else if(type==='new-trans'||type==='edit-trans'){

  // ── RUTINA ──
  else if(type==='new-rutina'||type==='edit-rutina'){

    const ejText=isEdit?(r.ejercicios||[]).map(e=>`${e.nombre},${e.series||''},${e.reps||''},${e.peso||''}`).join('\n'):'';

function closeModal(){document.getElementById('modal-root').innerHTML=''}
function overlayClose(e){if(e.target.classList.contains('modal-overlay'))closeModal()}
function selColorDot(el){document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected'));el.classList.add('selected');}

function saveNew(){
  const name=document.getElementById('fn').value.trim();
  if(!name)return notif('El nombre es obligatorio');
  const cl=document.getElementById('fcl').value;
  const tags=document.getElementById('ftags').value;
  db.projects.unshift({
    id:'p'+Date.now(),name,
    description:document.getElementById('fd').value.trim(),
    category:document.getElementById('fc').value,
    status:document.getElementById('fs').value,
    priority:document.getElementById('fp').value,
    deadline:document.getElementById('fdl').value,
    collaborators:cl?cl.split(',').map(c=>c.trim()).filter(Boolean):[],
    tags:tags?tags.split(',').map(t=>t.trim()).filter(Boolean):[],
    notes:'',resources:[],phases:[],ideas:[],tools:[]
  });
  save(db);closeModal();render();updateSidebar();notif('Proyecto creado ✓');
}
function saveEdit(id){
  const p=db.projects.find(pr=>pr.id===id);
  const name=document.getElementById('fn').value.trim();
  if(!name)return notif('El nombre es obligatorio');
  const cl=document.getElementById('fcl').value;
  const tags=document.getElementById('ftags').value;
  p.name=name;p.description=document.getElementById('fd').value.trim();
  p.category=document.getElementById('fc').value;p.status=document.getElementById('fs').value;
  p.priority=document.getElementById('fp').value;p.deadline=document.getElementById('fdl').value;
  p.collaborators=cl?cl.split(',').map(c=>c.trim()).filter(Boolean):[];
  p.tags=tags?tags.split(',').map(t=>t.trim()).filter(Boolean):[];
  if(activeProject&&activeProject.id===id)activeProject=p;
  save(db);closeModal();render();updateSidebar();notif('Guardado ✓');
}
function delProject(id){
  if(!confirm('¿Eliminar este proyecto?'))return;
  db.projects=db.projects.filter(p=>p.id!==id);
  save(db);
  if(view==='project-detail'&&activeProject&&activeProject.id===id)setView('dashboard');
  else{render();updateSidebar();}
  notif('Proyecto eliminado');
}
function savePhase(pid){
  const p=db.projects.find(pr=>pr.id===pid);
  const name=document.getElementById('fpn').value.trim();
  if(!name)return notif('Nombre obligatorio');
  p.phases.push({id:'ph'+Date.now(),name,desc:document.getElementById('fpd').value.trim(),status:'pending',startDate:document.getElementById('fps').value,endDate:document.getElementById('fpe').value,comments:[]});
  save(db);closeModal();render();notif('Fase añadida ✓');
}
function saveEditPhase(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const name=document.getElementById('fpn').value.trim();
  if(!name)return notif('Nombre obligatorio');
  ph.name=name;
  ph.desc=document.getElementById('fpd').value.trim();
  ph.startDate=document.getElementById('fps').value;
  ph.endDate=document.getElementById('fpe').value;
  ph.status=document.getElementById('fphst').value;
  save(db);closeModal();render();notif('Fase actualizada ✓');
}
function toggleStatusDropdown(phid, e){
  e.stopPropagation();
  const popup=document.getElementById('spp-'+phid);
  const pill=popup?.previousElementSibling;
  const isOpen=popup?.classList.contains('open');
  // close all open dropdowns first
  document.querySelectorAll('.status-popup.open').forEach(el=>el.classList.remove('open'));
  document.querySelectorAll('.phase-status-pill.open').forEach(el=>el.classList.remove('open'));
  if(!isOpen){
    popup?.classList.add('open');
    pill?.classList.add('open');
  }
}
function pickPhaseStatus(pid,phid,status){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  ph.status=status;
  save(db);
  // close popup and re-render
  document.querySelectorAll('.status-popup.open').forEach(el=>el.classList.remove('open'));
  render();
}
function setPhaseStatus(pid,phid,status){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  ph.status=status;
  save(db);render();
}
function cyclePhase(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  ph.status={pending:'active',active:'completed',completed:'pending'}[ph.status]||'pending';
  save(db);render();
}
function delPhase(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  p.phases=p.phases.filter(ph=>ph.id!==phid);
  save(db);render();
}
function togglePhaseTools(phid,e){
  if(e)e.stopPropagation();
  const el=document.getElementById('phtools-'+phid);
  if(!el)return;
  const isOpen=el.style.display!=='none';
  // close all open tool dropdowns first
  document.querySelectorAll('[id^="phtools-"]').forEach(d=>d.style.display='none');
  if(!isOpen)el.style.display='block';
}
function addPhaseTool(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const nameInput=document.getElementById('pt-name-'+phid);
  const linkInput=document.getElementById('pt-link-'+phid);
  const name=nameInput?.value.trim();
  if(!name)return notif('Escribe el nombre de la herramienta');
  if(!ph.tools)ph.tools=[];
  ph.tools.push({name,link:linkInput?.value.trim()||''});

function importBackup(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.projects||!Array.isArray(parsed.projects))throw new Error('Formato inválido');
      if(!confirm(`¿Importar backup? Esto reemplazará todos tus datos actuales (${db.projects.length} proyectos) con los del archivo (${parsed.projects.length} proyectos).`)){input.value='';return;}
      db={projects:parsed.projects,settings:parsed.settings||{}};
      save(db);
      if(parsed.extras){extras={diario:parsed.extras.diario||[],metas:parsed.extras.metas||[],plantillas:parsed.extras.plantillas||[],hoyTareas:parsed.extras.hoyTareas||[]};saveExtras();}
      if(parsed.bib){bib={items:parsed.bib.items||[],collections:parsed.bib.collections||[]};saveBib();}
      updateProfileName();
      setView('dashboard');
      notif(`Backup importado — ${parsed.projects.length} proyectos cargados ✓`);
    }catch(err){
      notif('Error: el archivo no es un backup válido');
    }
    input.value='';
  };
  reader.readAsText(file);
}

function loadExtras(){
  const diario=_query('SELECT data FROM diario ORDER BY date DESC').map(r=>JSON.parse(r.data));
  const metas=_query('SELECT data FROM metas').map(r=>JSON.parse(r.data));
  const plantillas=_query('SELECT data FROM plantillas').map(r=>JSON.parse(r.data));
  let hoyTareas=[];
  try{
    const row=_query('SELECT value FROM settings WHERE key=\'hoyTareas\'');
    if(row.length)hoyTareas=JSON.parse(row[0].value)||[];
  }catch(e){}
  return{diario,metas,plantillas,hoyTareas};
}
function saveExtras(){
  if(!_sqldb)return;
  _sqldb.run('BEGIN');
  try{
    _sqldb.run('DELETE FROM diario');(extras.diario||[]).forEach(_insertDiario);
    _sqldb.run('DELETE FROM metas');(extras.metas||[]).forEach(_insertMeta);
    _sqldb.run('DELETE FROM plantillas');(extras.plantillas||[]).forEach(_insertPlantilla);
    _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',['hoyTareas',JSON.stringify(extras.hoyTareas||[])]);
    _sqldb.run('COMMIT');
  }catch(e){_sqldb.run('ROLLBACK');throw e;}
  schedulePersist();
}

  const entry={id:'d'+Date.now(),date:today,title:'',content:''};

}
function renderTaskItem(pid,t){
  return`<div class="task-item ${t.done?'done':''}">
    <div class="task-check ${t.done?'checked':''}" onclick="toggleTask('${pid}','${t.phaseId}','${t.id}')"></div>
    <span class="task-text">${t.text}</span>
    ${t.phaseName?`<span class="task-phase-tag">${t.phaseName}</span>`:''}
    <button class="icon-btn red" onclick="deleteTask('${pid}','${t.phaseId}','${t.id}')"><span class="icon">close</span></button>
  </div>`;
}
function addTask(pid){
  const p=db.projects.find(pr=>pr.id===pid);
  const input=document.getElementById('task-input-'+pid);
  const phSel=document.getElementById('task-phase-sel-'+pid);
  const text=input?.value.trim();
  if(!text)return notif('Escribe el texto de la tarea');
  const phId=phSel?.value;
  const ph=p.phases.find(ph=>ph.id===phId)||p.phases[0];
  if(!ph)return notif('El proyecto no tiene fases');
  if(!ph.tasks)ph.tasks=[];
  ph.tasks.push({id:'t'+Date.now(),text,done:false});
  save(db);render();
}
function toggleTask(pid,phid,tid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const t=ph?.tasks?.find(t=>t.id===tid);
  if(t){t.done=!t.done;save(db);render();}
}
function deleteTask(pid,phid,tid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  if(ph?.tasks)ph.tasks=ph.tasks.filter(t=>t.id!==tid);
  save(db);render();
}

function closeFocusMode(){document.getElementById('modal-root').innerHTML='';_focusProject=null;}
function addFocusTask(pid){
  const p=db.projects.find(pr=>pr.id===pid);
  const input=document.getElementById('focus-task-input');
  const text=input?.value.trim();
  if(!text)return notif('Escribe el texto de la tarea');

function renderUniCalendario(){
  if(!_uniCalMes){const n=new Date();_uniCalMes={y:n.getFullYear(),m:n.getMonth()};}
  const {y,m}=_uniCalMes;
  const today=new Date();
  const todayStr=today.toISOString().slice(0,10);
  const firstDay=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0);
  const startDow=(firstDay.getDay()+6)%7;
  const days=[];
  for(let i=0;i<startDow;i++){const d=new Date(y,m,-startDow+i+1);days.push({date:d,cur:false});}
  for(let d=1;d<=lastDay.getDate();d++)days.push({date:new Date(y,m,d),cur:true});
  const endFill=7-(days.length%7);
  if(endFill<7)for(let i=1;i<=endFill;i++)days.push({date:new Date(y,m+1,i),cur:false});
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const pruebas=uni.pruebas;const trabajos=uni.trabajos;const ramos=uni.ramos;
  const dayNames=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const upcomingEvts=[...pruebas.map(p=>({...p,kind:'prueba',fecha:p.fecha})),...trabajos.map(t=>({...t,kind:'trabajo',fecha:t.fecha_entrega}))].filter(e=>e.fecha>=todayStr).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,8);
  return`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem">
      <div style="font-size:18px;font-weight:600;letter-spacing:-.01em">${monthNames[m]} ${y}</div>
      <div style="display:flex;gap:6px">
        <button class="btn-ghost" style="padding:6px 10px" onclick="_uniCalMes={y:${m===0?y-1:y},m:${m===0?11:m-1}};render()"><span class="icon">chevron_left</span></button>
        <button class="btn-ghost" style="padding:6px 10px" onclick="_uniCalMes={y:${m===11?y+1:y},m:${m===11?0:m+1}};render()"><span class="icon">chevron_right</span></button>
      </div>
    </div>
    <div class="uni-cal-days">${dayNames.map(d=>`<div class="uni-cal-dayname">${d}</div>`).join('')}</div>
    <div class="uni-cal-grid">${days.map(({date,cur})=>{
      const ds=date.toISOString().slice(0,10);
      const dPruebas=pruebas.filter(p=>p.fecha===ds);
      const dTrabajos=trabajos.filter(t=>t.fecha_entrega===ds);
      const isToday=ds===todayStr;
      return`<div class="uni-cal-cell ${!cur?'other-month':''} ${isToday?'today':''}">
        <div class="uni-cal-num">${date.getDate()}</div>
        ${dPruebas.map(p=>`<div class="cal-evt prueba" title="${p.nombre}">${p.nombre}</div>`).join('')}
        ${dTrabajos.map(t=>`<div class="cal-evt trabajo" title="${t.nombre}">${t.nombre}</div>`).join('')}
      </div>`;
    }).join('')}</div>
    <div class="sec-head"><div class="sec-title"><span class="icon">upcoming</span> Próximos eventos</div></div>
    ${upcomingEvts.length?`<div class="eval-list">${upcomingEvts.map(e=>{
      const ramo=ramos.find(r=>r.id===e.ramo_id);
      const col=ramo?.color||'var(--accent)';
      return`<div class="eval-item">
        <span class="icon" style="color:${e.kind==='prueba'?'var(--red)':'var(--blue)'}">${e.kind==='prueba'?'quiz':'assignment'}</span>
        <div class="eval-body"><div class="eval-name">${e.nombre}</div>
          <div class="eval-meta">${ramo?`<span class="badge" style="background:${col}22;color:${col}">${ramo.nombre}</span>`:''}<span>${fmtDate2(e.fecha)}</span></div>
        </div>
        <span class="badge" style="background:${e.kind==='prueba'?'var(--red-light)':'var(--blue-light)'};color:${e.kind==='prueba'?'var(--red-dark)':'var(--blue-dark)'}">${e.kind==='prueba'?'Prueba':'Trabajo'}</span>
      </div>`;
    }).join('')}</div>`:`<div style="color:var(--text3);font-size:13px;padding:.5rem 0">Sin eventos próximos.</div>`}`;
}

function renderFinanzas(){
  const now=new Date();

  if(!_finMes)_finMes=curMes;
  let trans=[...personal.transacciones];
  if(_finTipo!=='all')trans=trans.filter(t=>t.tipo===_finTipo);

  const todosIngM=personal.transacciones.filter(t=>t.tipo==='ingreso'&&t.fecha&&t.fecha.startsWith(_finMes));
  const todosGasM=personal.transacciones.filter(t=>t.tipo==='gasto'&&t.fecha&&t.fecha.startsWith(_finMes));

function calcRacha(registros){
  if(!registros.length)return 0;
  const today=new Date();today.setHours(0,0,0,0);
  const dates=[...new Set(registros.map(r=>r.fecha))].sort().reverse();
  let racha=0;let cur=new Date(today);
  for(const d of dates){
    const dt=new Date(d+'T12:00:00');dt.setHours(0,0,0,0);
    const diff=Math.round((cur-dt)/(1000*60*60*24));
    if(diff===0||diff===1){racha++;cur=dt;}else break;
  }
  return racha;
}

function addHoyTarea(){
  const inp=document.getElementById('hoy-tarea-input');
  const text=inp?.value?.trim();
  if(!text)return;
  if(!extras.hoyTareas)extras.hoyTareas=[];
  extras.hoyTareas.push({id:'ht'+Date.now(),text,done:false});
  inp.value='';
  saveExtras();render();
}
function toggleHoyTarea(id){
  const t=(extras.hoyTareas||[]).find(t=>t.id===id);
  if(t){t.done=!t.done;saveExtras();render();}
}
function delHoyTarea(id){
  extras.hoyTareas=(extras.hoyTareas||[]).filter(t=>t.id!==id);
  saveExtras();render();
}

function renderBibCard(it){
  const cfg=catConfig[it.type]||catConfig.all;

function copyBibItem(id){
  const it=bib.items.find(i=>i.id===id);

  bib.collections=bib.collections.filter(c=>c!==name);
  bib.items.forEach(it=>{if(it.collection===name)it.collection='';});

function exportBib(){
  const blob=new Blob([JSON.stringify(bib,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`biblioteca-${new Date().toISOString().slice(0,10)}.json`;
  a.click();notif('Biblioteca exportada ✓');
}

function importBib(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(!parsed.items||!Array.isArray(parsed.items))throw new Error();
      if(!confirm(`¿Importar biblioteca? Se reemplazarán tus ${bib.items.length} recursos actuales con ${parsed.items.length} del archivo.`)){input.value='';return;}
      bib=parsed;saveBib();render();notif(`Biblioteca importada — ${parsed.items.length} recursos ✓`);
    }catch{notif('Error: archivo inválido');}
    input.value='';
  };
  reader.readAsText(file);
}

  const type=document.getElementById('bib-type')?.value;

function saveBibItem(editId){
  const title=document.getElementById('bib-title')?.value.trim();
  if(!title)return notif('El título es obligatorio');
  const tags=document.getElementById('bib-tags')?.value;
  const data={
    type:document.getElementById('bib-type').value,
    title,
    desc:document.getElementById('bib-desc').value.trim(),
    prompt:document.getElementById('bib-prompt')?.value.trim()||'',
    link:document.getElementById('bib-link')?.value.trim()||'',
    links:collectBibLinks(),
    model:document.getElementById('bib-model')?.value||'',
    price:document.getElementById('bib-price')?.value||'',
    collection:document.getElementById('bib-collection').value,
    tags:tags?tags.split(',').map(t=>t.trim()).filter(Boolean):[],
  };
  if(editId){
    const it=bib.items.find(i=>i.id===editId);
    Object.assign(it,data);
  } else {
    bib.items.push({id:'b'+Date.now(),fav:false,...data});
  }
  saveBib();closeModal();render();notif(editId?'Recurso actualizado ✓':'Recurso añadido ✓');
}

function submitCapture(){
  const title=document.getElementById('cap-in')?.value.trim();
  if(!title)return notif('Escribe algo primero');
  const space=document.querySelector('.cap-space.on')?.dataset.space||'work';
  if(space==='work'){
    const notes=document.getElementById('cap-ta')?.value.trim()||'';
    db.projects.unshift({
      id:'p'+Date.now(),name:title,
      description:notes,category:'personal',status:'idea',priority:'media',
      deadline:'',collaborators:[],tags:['captura'],notes:'',resources:[],phases:[],ideas:[],tools:[]
    });
    save(db);updateSidebar();
    notif('Idea capturada en Work ✓');
    if(view==='dashboard'||view==='inicio')render();
  } else if(space==='university'){
    const tipo=document.getElementById('cap-uni-tipo')?.value||'prueba';
    const ramo_id=document.getElementById('cap-uni-ramo')?.value||'';
    const fecha=document.getElementById('cap-uni-fecha')?.value||'';
    if(tipo==='prueba'){
      uni.pruebas.push({id:'up'+Date.now(),ramo_id,nombre:title,fecha,nota:null,tipo:'',porcentaje:''});
    } else {
      uni.trabajos.push({id:'ut'+Date.now(),ramo_id,nombre:title,fecha_entrega:fecha,estado:'pendiente',tipo:''});
    }
    saveUni();updateSidebar();
    notif(`${tipo==='prueba'?'Prueba':'Trabajo'} capturado en University ✓`);
    if(['uni-pruebas','uni-trabajos','uni-calendario','inicio'].includes(view))render();
  } else if(space==='personal'){
    const tipo=document.getElementById('cap-fin-tipo')?.value||'gasto';
    const monto=parseFloat(document.getElementById('cap-fin-monto')?.value||'0')||0;
    const categoria=document.getElementById('cap-fin-cat')?.value||'otros';
    const fecha=new Date().toISOString().slice(0,10);
    personal.transacciones.unshift({id:'ft'+Date.now(),tipo,nombre:title,monto,fecha,categoria,nota:''});
    savePersonal();
    notif(`${tipo==='ingreso'?'Ingreso':'Gasto'} capturado en Personal ✓`);
    if(['fin-finanzas','inicio'].includes(view))render();
  }
  closeCapture();
}
function selectCapSpace(el){
  document.querySelectorAll('.cap-space').forEach(s=>s.classList.remove('on'));
  el.classList.add('on');
  updateCapFields(el.dataset.space);
  setTimeout(()=>document.getElementById('cap-in')?.focus(),50);
}
function setMobNav(section){
  document.querySelectorAll('.mob-nav-btn').forEach(b=>b.classList.remove('on'));
  const btn=document.getElementById('mob-btn-'+section);
  if(btn)btn.classList.add('on');
}
function toggleSidebar(){
  const s=document.getElementById('sidebar');
  if(s)s.classList.toggle('mob-open');
}
function closeSidebar(){
  const s=document.getElementById('sidebar');
  const o=document.getElementById('mob-overlay');
  if(s)s.classList.remove('mob-open');
  if(o)o.classList.remove('open');
}
// ═══ UNIVERSITY CRUD ═══
function delRamo(id){
  if(!confirm('¿Eliminar este ramo y sus pruebas/trabajos?'))return;
  uni.ramos=uni.ramos.filter(r=>r.id!==id);
  uni.pruebas=uni.pruebas.filter(p=>p.ramo_id!==id);
  uni.trabajos=uni.trabajos.filter(t=>t.ramo_id!==id);
  saveUni();updateSidebar();render();
}
function saveNewRamo(){
  const n=document.getElementById('fn').value.trim();if(!n)return notif('El nombre es obligatorio');
  const color=document.querySelector('.color-dot.selected')?.dataset.color||'var(--accent)';
  uni.ramos.push({id:'r'+Date.now(),nombre:n,profesor:document.getElementById('fprof').value.trim(),creditos:document.getElementById('fcred').value||'',color});
  saveUni();updateSidebar();closeModal();render();notif('Ramo creado ✓');
}
function saveEditRamo(id){
  const r=uni.ramos.find(x=>x.id===id);if(!r)return;
  r.nombre=document.getElementById('fn').value.trim()||r.nombre;

}
function delPrueba(id){uni.pruebas=uni.pruebas.filter(p=>p.id!==id);saveUni();render();}

  p.ramo_id=document.getElementById('framo').value;

function delTrabajo(id){uni.trabajos=uni.trabajos.filter(t=>t.id!==id);saveUni();render();}
function setTrabajoEstado(id,estado){
  const t=uni.trabajos.find(x=>x.id===id);if(!t)return;
  t.estado=estado;
  if(estado==='calificado'&&(t.nota==null||t.nota===''))openModal('edit-trabajo',id);
  else{saveUni();render();}

function saveNewTrabajo(){

  uni.trabajos.push({id:'t'+Date.now(),ramo_id:document.getElementById('framo').value,nombre:n,tipo:document.getElementById('ftipo').value,fecha_entrega:document.getElementById('ffecha').value,estado:document.getElementById('festado').value||'pendiente',nota:nota!==''?parseFloat(nota):null,descripcion:document.getElementById('fdesc').value.trim()});

}
function saveEditTrabajo(id){
  const t=uni.trabajos.find(x=>x.id===id);if(!t)return;

// ═══ FINANZAS CRUD ═══
function delTrans(id){personal.transacciones=personal.transacciones.filter(t=>t.id!==id);savePersonal();render();}

  const n=document.getElementById('fn').value.trim();

  t.tipo=document.getElementById('ftipo').value||t.tipo;

// ═══ GIMNASIO CRUD ═══
function logSesion(rutinaId){
  const today=new Date().toISOString().slice(0,10);
  const alreadyToday=personal.registros.some(r=>r.rutina_id===rutinaId&&r.fecha===today);
  if(alreadyToday){if(!confirm('Ya registraste esta rutina hoy. ¿Registrar de nuevo?'))return;}
  const notas=prompt('Notas de la sesión (opcional):','');
  if(notas===null)return;
  personal.registros.unshift({id:'reg'+Date.now(),rutina_id:rutinaId,fecha:today,notas:notas||''});
  savePersonal();render();notif('Sesión registrada ✓');
}
function delRegistro(id){personal.registros=personal.registros.filter(r=>r.id!==id);savePersonal();render();}
function delRutina(id){if(!confirm('¿Eliminar esta rutina y su historial?'))return;personal.rutinas=personal.rutinas.filter(r=>r.id!==id);personal.registros=personal.registros.filter(r=>r.rutina_id!==id);savePersonal();render();}
function saveNewRutina(){
  const n=document.getElementById('fn').value.trim();if(!n)return notif('El nombre es obligatorio');
  const ejRaw=document.getElementById('fejercicios').value.trim();
  const ejercicios=ejRaw?ejRaw.split('\n').filter(Boolean).map(line=>{
    const parts=line.split(',').map(s=>s.trim());
    return{nombre:parts[0]||line,series:parts[1]||'',reps:parts[2]||'',peso:parts[3]||''};
  }):[];
  personal.rutinas.push({id:'ru'+Date.now(),nombre:n,ejercicios});
  savePersonal();closeModal();render();notif('Rutina creada ✓');
}
function saveEditRutina(id){
  const r=personal.rutinas.find(x=>x.id===id);if(!r)return;
  r.nombre=document.getElementById('fn').value.trim()||r.nombre;
  const ejRaw=document.getElementById('fejercicios').value.trim();
  r.ejercicios=ejRaw?ejRaw.split('\n').filter(Boolean).map(line=>{
    const parts=line.split(',').map(s=>s.trim());
    return{nombre:parts[0]||line,series:parts[1]||'',reps:parts[2]||'',peso:parts[3]||''};
  }):[];
  savePersonal();closeModal();render();notif('Rutina actualizada ✓');
}

function newEspacioNota(){
  const nota={id:'en'+Date.now(),titulo:'',contenido:'',updated_at:new Date().toISOString()};
  personal.notas.unshift(nota);_espacioNota=nota.id;savePersonal();render();
  setTimeout(()=>document.getElementById('espacio-title')?.focus(),60);
}
function delEspacioNota(id){
  personal.notas=personal.notas.filter(n=>n.id!==id);
  _espacioNota=personal.notas[0]?.id||null;
  savePersonal();render();
}
function scheduleEspacioSave(){
  clearTimeout(_espacioTimer);_espacioTimer=setTimeout(saveEspacioNow,600);
}
function saveEspacioNow(){
  const n=personal.notas.find(x=>x.id===_espacioNota);if(!n)return;
  n.titulo=document.getElementById('espacio-title')?.value||'';
  n.contenido=document.getElementById('espacio-ta')?.value||'';
  n.updated_at=new Date().toISOString();
  personal.notas.sort((a,b)=>b.updated_at.localeCompare(a.updated_at));
  savePersonal();
  const s=document.getElementById('espacio-saved');
  if(s){s.style.opacity='1';setTimeout(()=>s.style.opacity='0',1400);}
}
