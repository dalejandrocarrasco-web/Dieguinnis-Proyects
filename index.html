<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life OS — High Performance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%235E6AD2'/><text y='.75em' font-size='52' x='14' font-family='sans-serif' font-weight='700' fill='white'>L</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#121319;
  --surface:#1b1b22;
  --surface2:#1f1f26;
  --surface3:#292930;
  --surface4:#34343b;
  --border:rgba(69,70,82,.5);
  --border2:#454652;
  --text:#e4e1eb;
  --text2:#c6c5d5;
  --text3:#8A8A8A;
  --accent:#5E6AD2;
  --accent-light:rgba(94,106,210,.12);
  --accent-dark:#bdc2ff;
  --accent-glow:rgba(94,106,210,.14);
  --purple:#8B5CF6;
  --purple-light:rgba(139,92,246,.12);
  --purple-text:#A78BFA;
  --amber:#F59E0B;
  --amber-light:rgba(245,158,11,.12);
  --amber-dark:#FCD34D;
  --blue:#3B82F6;
  --blue-light:rgba(59,130,246,.12);
  --blue-dark:#93C5FD;
  --red:#EF5350;
  --red-light:rgba(239,83,80,.12);
  --red-dark:#FCA5A5;
  --green:#4CAF7D;
  --green-light:rgba(76,175,125,.12);
  --green-dark:#6EE7B7;
  --teal:#14B8A6;
  --teal-light:rgba(20,184,166,.12);
  --radius:4px;
  --radius-lg:4px;
  --radius-xl:6px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5);
}
body{font-family:'Geist',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:'cv02','cv03','cv04','cv11'}
.icon{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20;font-size:18px;line-height:1;user-select:none;vertical-align:middle;display:inline-block}
.mono{font-family:'JetBrains Mono',monospace}

/* LAYOUT */
.shell{display:flex;min-height:100vh}
.sidebar{width:232px;min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1rem .75rem 1rem;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
.logo{padding:0 8px;margin-bottom:1.75rem}
.logo-mark{display:flex;align-items:center;gap:9px}
.logo-icon{width:28px;height:28px;border-radius:4px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:#fff;letter-spacing:-.02em;flex-shrink:0}
.logo-text{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.02em;line-height:1.2}
.logo-text span{color:var(--accent-dark)}
.logo-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);margin-top:2px;letter-spacing:.03em}

.nav-section{margin-bottom:1.25rem}
.nav-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:0 8px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);font-size:14px;font-weight:400;color:var(--text3);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit;position:relative}
.nav-item:hover{background:var(--surface4);color:var(--text)}
.nav-item.active{background:var(--surface4);color:var(--text);font-weight:500}
.nav-item .icon{font-size:16px;flex-shrink:0}
.nav-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface3);color:var(--text3);padding:1px 6px;border-radius:2px;font-weight:500}
.nav-item.active .nav-count{background:var(--accent-glow);color:var(--accent-dark)}
.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}

/* TOPBAR */
.main{margin-left:232px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.75rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:14px;font-weight:500;color:var(--text)}
.topbar-actions{display:flex;gap:6px;align-items:center}

/* BUTTONS */
.view-switcher{display:flex;background:var(--surface2);border-radius:var(--radius);padding:2px;gap:2px;border:1px solid var(--border)}
.vs-btn{background:none;border:none;padding:5px 8px;cursor:pointer;color:var(--text3);font-size:14px;border-radius:var(--radius);transition:all .12s}
.vs-btn.active{background:var(--surface3);color:var(--text)}
.vs-btn:hover:not(.active){color:var(--text2)}

.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:400;transition:opacity .12s;white-space:nowrap}
.btn-primary:hover{opacity:.88}
.btn-primary:active{opacity:.75}

.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);padding:7px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s;white-space:nowrap}
.btn-ghost:hover{background:var(--surface4)}

.theme-toggle{background:none;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 9px;cursor:pointer;color:var(--text2);font-size:15px;display:flex;align-items:center;transition:all .12s}
.theme-toggle:hover{color:var(--text);background:var(--surface3)}
#theme-btn{display:none}

.icon-btn{background:none;border:none;cursor:pointer;padding:5px 6px;color:var(--text3);font-size:15px;border-radius:var(--radius);transition:all .12s;line-height:1}
.icon-btn:hover{color:var(--text2);background:var(--surface3)}
.icon-btn.red:hover{color:var(--red);background:var(--red-light)}

.content{padding:1.75rem;flex:1}

/* TOPBAR SEARCH */
.topbar-search-wrap{position:relative;display:flex;align-items:center}
.topbar-search-box{display:none;align-items:center;position:relative;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 10px 6px 36px;animation:searchExpand .15s ease}
.topbar-search-box.open{display:flex}
@keyframes searchExpand{from{opacity:0;transform:scaleX(.95);transform-origin:right}to{opacity:1;transform:scaleX(1)}}
.topbar-search-input{background:none;border:none;outline:none;font-size:13px;color:var(--text);font-family:inherit;width:220px}
.topbar-search-input::placeholder{color:var(--text3)}
.search-results{position:absolute;top:calc(100% + 8px);right:0;width:360px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);overflow:hidden;display:none;box-shadow:var(--shadow-lg);z-index:100}
.search-results.open{display:block;animation:popIn .12s ease}
.sr-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;display:flex;align-items:center;gap:10px}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--surface2)}
.sr-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);min-width:68px}
.sr-name{font-size:13px;color:var(--text);flex:1}
.sr-proj{font-size:11px;color:var(--text3)}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.filter-input,.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .12s}
.filter-input{flex:1;min-width:160px}
.filter-input::placeholder{color:var(--text3)}
.filter-input:focus,.filter-select:focus{border-color:var(--accent)}
.filter-select{cursor:pointer}
.tag-chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:3px 10px;border-radius:2px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .12s}
.tag-chip.active,.tag-chip:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent-dark)}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem;transition:border-color .12s}
.stat-card:hover{border-color:var(--border2)}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.stat-value{font-size:26px;font-weight:600;color:var(--text);line-height:1;letter-spacing:-.02em}
.stat-icon{display:none}

/* PROJECT GRID */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.project-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;cursor:pointer;transition:border-color .12s;display:flex;flex-direction:column}
.project-card:hover{border-color:var(--border2)}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-title{font-size:14px;font-weight:600;color:var(--text);line-height:1.3;letter-spacing:-.01em}
.card-menu{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.project-card:hover .card-menu{opacity:1}

.card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:1px 6px;border-radius:2px;letter-spacing:.05em;text-transform:uppercase}
.badge-personal{background:var(--green-light);color:var(--green)}
.badge-negocio{background:var(--blue-light);color:var(--blue-dark)}
.badge-activo{background:var(--green-light);color:var(--green)}
.badge-pausa{background:var(--amber-light);color:var(--amber-dark)}
.badge-completado{background:var(--teal-light);color:var(--teal)}
.badge-idea{background:var(--purple-light);color:var(--purple-text)}
.badge-alta{background:var(--red-light);color:var(--red-dark)}
.badge-media{background:var(--amber-light);color:var(--amber-dark)}
.badge-baja{background:var(--green-light);color:var(--green)}
.custom-tag-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:1px 6px;border-radius:2px;background:var(--surface3);color:var(--text3);border:1px solid var(--border);letter-spacing:.04em;text-transform:uppercase}

.card-desc{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:12px;flex:1}
.progress-wrap{margin-bottom:10px}
.progress-meta{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);margin-bottom:4px;letter-spacing:.03em}
.progress-bar{height:3px;background:var(--surface4);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease}
.card-bottom{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text3)}
.collabs{display:flex}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--surface3);border:2px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--text2);margin-left:-6px}
.avatar:first-child{margin-left:0}

/* PROJECT CARD PRIORITY BORDERS */
.project-card{border-left-width:3px}
.project-card.pri-alta{border-left-color:var(--red)}
.project-card.pri-media{border-left-color:var(--amber)}
.project-card.pri-baja{border-left-color:var(--green)}

/* KANBAN */
.kanban-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kanban-col{background:var(--surface2);border-radius:var(--radius);padding:12px;border:1px solid var(--border)}
.kanban-col-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kanban-col-count{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface4);color:var(--text3);padding:1px 7px;border-radius:2px;font-weight:500}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:border-color .12s;margin-bottom:6px}
.kanban-card:hover{border-color:var(--border2)}
.kanban-card.pri-alta{border-left-color:var(--red)}
.kanban-card.pri-media{border-left-color:var(--amber)}
.kanban-card.pri-baja{border-left-color:var(--green)}
.kanban-card-title{font-size:13px;font-weight:500;margin-bottom:4px;color:var(--text)}
.kanban-card-meta{font-size:11px;color:var(--text3)}

/* TIMELINE */
.timeline-wrap{overflow-x:auto;padding-bottom:1rem}
.timeline-header{display:flex;margin-bottom:8px;margin-left:180px}
.timeline-month{font-size:11px;font-weight:500;color:var(--text3);flex:none;text-align:center;border-left:1px solid var(--border)}
.timeline-row{display:flex;align-items:center;margin-bottom:8px;height:40px}
.timeline-label{width:180px;flex:none;font-size:12px;font-weight:500;color:var(--text2);padding-right:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:color .15s}
.timeline-label:hover{color:var(--accent)}
.timeline-track{flex:1;position:relative;height:100%;border-left:1px solid var(--border)}
.timeline-bar{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:99px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;transition:opacity .15s;box-shadow:var(--shadow-sm)}
.timeline-bar:hover{opacity:.85}

/* DETAIL */
.detail-wrap{animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.detail-head{margin-bottom:6px}
.detail-title{font-size:24px;font-weight:600;color:var(--text);line-height:1.2;letter-spacing:-.02em}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.detail-desc{font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:1.5rem}

.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.75rem}
.ds-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.ds-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.ds-value{font-size:14px;font-weight:500;color:var(--text)}

/* TABS */
.detail-tabs{display:flex;gap:1px;margin-bottom:1.5rem;background:var(--surface2);padding:3px;border-radius:var(--radius);width:fit-content;border:1px solid var(--border)}
.detail-tab{background:none;border:none;border-radius:var(--radius);padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.detail-tab .icon{font-size:14px}
.detail-tab.active{background:var(--surface3);color:var(--text);font-weight:500}
.detail-tab:hover:not(.active){color:var(--text2)}

.sec-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:9px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sec-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:7px}
.sec-count{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface3);color:var(--text3);padding:1px 7px;border-radius:2px;font-weight:500}

/* PHASES */
.phases-list{display:flex;flex-direction:column;gap:8px}
.phase-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:0;display:flex;gap:14px;align-items:flex-start;transition:border-color .15s;border-left-width:3px}
.phase-item.status-pending{border-left-color:var(--border2)}
.phase-item.status-active{border-left-color:var(--accent)}
.phase-item.status-completed{border-left-color:var(--green)}
.phase-num{width:22px;height:22px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);flex-shrink:0;margin-top:2px}
.phase-body{flex:1;min-width:0}
.phase-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.phase-desc-text{font-size:12px;color:var(--text2);margin-bottom:4px}
.phase-dates{font-size:11px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.phase-notes-wrap{margin-top:6px}
.phase-notes-ta{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;font-size:12px;color:var(--text);font-family:inherit;outline:none;resize:none;min-height:60px;line-height:1.5;transition:border-color .12s}
.phase-notes-ta:focus{border-color:var(--accent)}
.phase-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
/* HOY TAREAS */
.hoy-tarea-item{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--border)}
.hoy-tarea-item:last-child{border-bottom:none}
.hoy-tarea-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;background:none}
.hoy-tarea-check:hover{border-color:var(--accent)}
.hoy-tarea-check.done{background:var(--accent);border-color:var(--accent)}
.hoy-tarea-check.done::after{content:'✓';color:#fff;font-size:9px;font-weight:700}
.hoy-tarea-text{font-size:13px;flex:1;color:var(--text)}
.hoy-tarea-text.done{text-decoration:line-through;color:var(--text3)}
.hoy-tarea-add{display:flex;gap:6px;margin-top:8px}
.hoy-tarea-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .12s}
.hoy-tarea-input:focus{border-color:var(--accent)}

/* PHASE STATUS DROPDOWN */
.phase-status-dropdown{position:relative;display:inline-block}
.phase-status-pill{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;border-radius:2px;padding:4px 10px 4px 8px;cursor:pointer;border:1px solid transparent;outline:none;transition:all .12s;display:flex;align-items:center;gap:5px;user-select:none;white-space:nowrap}
.phase-status-pill .icon{font-size:12px;transition:transform .15s}
.phase-status-pill.open .icon:last-child{transform:rotate(180deg)}
.phase-status-pill.pending{background:var(--surface2);color:var(--text2);border-color:var(--border)}
.phase-status-pill.pending:hover{border-color:var(--border2)}
.phase-status-pill.active{background:var(--blue-light);color:var(--blue-dark)}
.phase-status-pill.completed{background:var(--green-light);color:var(--green-dark)}
.phase-status-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.phase-status-pill.pending .phase-status-dot{background:var(--text3)}
.phase-status-pill.active .phase-status-dot{background:var(--blue)}
.phase-status-pill.completed .phase-status-dot{background:var(--green)}
.status-popup{position:absolute;top:calc(100% + 5px);left:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:4px;z-index:50;min-width:148px;box-shadow:var(--shadow-lg);display:none}
.status-popup.open{display:block;animation:popIn .12s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-5px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.status-option{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);transition:background .1s;font-family:inherit}
.status-option:hover{background:var(--surface2);color:var(--text)}
.status-option.selected{color:var(--text);background:var(--surface2)}
.status-option-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.so-pending .status-option-dot{background:var(--text3)}
.so-active .status-option-dot{background:var(--blue)}
.so-completed .status-option-dot{background:var(--green)}

/* IDEAS */
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.idea-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;position:relative;transition:border-color .12s}
.idea-card:hover{border-color:var(--border2)}
.idea-text{font-size:12px;color:var(--text2);line-height:1.6;padding-right:20px}
.idea-del{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:var(--text3);opacity:.5;font-size:13px;transition:opacity .12s,color .12s;padding:2px;border-radius:4px}
.idea-del:hover{opacity:1;color:var(--red)}

/* NOTES */
.notes-area{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--text);font-family:inherit;outline:none;min-height:160px;resize:vertical;line-height:1.65;transition:border-color .12s}
.notes-area:focus{border-color:var(--accent)}
.notes-saved{font-size:11px;font-weight:500;color:var(--green);margin-top:5px;opacity:0;transition:opacity .3s}
.notes-saved.show{opacity:1}

/* RESOURCES & TOOLS */
.resources-list,.tools-list{display:flex;flex-direction:column;gap:6px}
.resource-item,.tool-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;gap:10px;transition:border-color .12s}
.resource-item:hover,.tool-item:hover{border-color:var(--border2)}
.resource-icon{font-size:15px;color:var(--text3);background:var(--surface2);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.resource-name,.tool-name{font-size:13px;font-weight:500;flex:1;color:var(--text)}
.resource-link,.tool-link{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:6px;background:var(--accent-light);transition:all .12s}
.resource-link:hover,.tool-link:hover{background:var(--accent);color:#fff}
.tool-phase-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);background:var(--surface3);padding:2px 9px;border-radius:2px;letter-spacing:.03em;text-transform:uppercase}
.project-link-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--accent-dark);cursor:pointer;background:var(--accent-light);padding:2px 9px;border-radius:2px;letter-spacing:.03em;text-transform:uppercase;transition:all .12s}
.project-link-tag:hover{background:var(--accent);color:#fff}

/* EXPORT BTN */
.export-btn{background:none;border:1px solid var(--border2);border-radius:var(--radius);padding:6px 12px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;transition:all .15s}
.export-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-light)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:1.75rem;width:520px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:fadeUp .18s ease;box-shadow:var(--shadow-lg)}
.modal-title{font-size:16px;font-weight:600;margin-bottom:1.25rem;color:var(--text);letter-spacing:-.01em}
.form-group{margin-bottom:1rem}
.form-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.form-input,.form-textarea,.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .12s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent)}
.form-textarea{min-height:80px;resize:vertical;line-height:1.55}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:.875rem;border-top:1px solid var(--border)}

/* SHARE */
.share-box{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:12px 16px;display:flex;align-items:center;gap:10px;margin-top:8px}
.share-url{font-size:12px;color:var(--text2);flex:1;word-break:break-all}

/* NOTIF */
.notif{position:fixed;bottom:20px;right:20px;background:var(--surface3);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;font-size:13px;font-weight:500;z-index:999;animation:slideUp .2s ease;box-shadow:var(--shadow-lg)}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}

/* EMPTY */
.empty{text-align:center;padding:5rem 1rem;color:var(--text3);grid-column:1/-1}
.empty .icon{font-size:52px;display:block;margin-bottom:16px;opacity:.4}
.empty p{font-size:14px}

/* BRIEF TAB */
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.brief-field{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;display:flex;flex-direction:column;gap:8px;transition:border-color .12s}
.brief-field:hover{border-color:var(--border2)}
.brief-field:focus-within{border-color:var(--accent)}
.brief-field.full{grid-column:1/-1}
.brief-field-header{display:flex;align-items:center;gap:9px}
.brief-field-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.brief-field-label{font-size:13px;font-weight:600;color:var(--text)}
.brief-field-hint{font-size:11px;color:var(--text3);margin-top:1px}
.brief-textarea{width:100%;background:transparent;border:none;outline:none;resize:vertical;line-height:1.6;min-height:72px;font-size:13px;color:var(--text);font-family:inherit}
.brief-textarea::placeholder{color:var(--text3)}
.brief-saved{font-size:11px;font-weight:500;color:var(--green);text-align:right;min-height:14px;opacity:0;transition:opacity .3s}
.brief-saved.show{opacity:1}

/* PHASE DOC */
.phase-doc-wrap{animation:fadeUp .22s ease;max-width:800px;margin:0 auto}
.phase-doc-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;gap:12px}
.phase-doc-breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text3)}
.phase-doc-breadcrumb span{cursor:pointer;transition:color .15s;font-weight:400}
.phase-doc-breadcrumb span:hover{color:var(--accent)}
.phase-doc-breadcrumb .icon{font-size:14px}
.phase-doc-meta{display:flex;gap:8px;align-items:center;margin-bottom:1.75rem;flex-wrap:wrap}
.phase-doc-status{font-size:12px;font-weight:500;padding:5px 12px;border-radius:99px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.phase-doc-status:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.phase-doc-status.completed{background:var(--green-light);color:var(--green-dark);border-color:transparent}
.phase-doc-status.active{background:var(--blue-light);color:var(--blue-dark);border-color:transparent}
.doc-saved{font-size:11px;font-weight:500;color:var(--green);opacity:0;transition:opacity .3s}
.doc-saved.show{opacity:1}

/* EDITOR */
.editor-toolbar{display:flex;align-items:center;gap:1px;padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;flex-wrap:wrap;position:sticky;top:57px;z-index:5}
.tb-btn{background:none;border:none;cursor:pointer;padding:5px 7px;border-radius:6px;color:var(--text2);font-size:14px;transition:all .12s;font-family:inherit;line-height:1;display:flex;align-items:center}
.tb-btn:hover{background:var(--surface2);color:var(--text)}
.tb-sep{width:1px;height:16px;background:var(--border2);margin:0 4px}
.tb-select{background:none;border:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:4px 7px;border-radius:6px;outline:none}
.tb-select:hover{background:var(--surface2);color:var(--text)}
.editor-area{min-height:500px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 2.5rem;outline:none;font-size:14px;line-height:1.75;color:var(--text);font-family:inherit;transition:border-color .12s}
.editor-area:focus{border-color:var(--accent)}
.editor-area h1{font-size:26px;font-weight:600;margin:1.25rem 0 .5rem;color:var(--text);line-height:1.2;letter-spacing:-.02em}
.editor-area h2{font-size:20px;font-weight:600;margin:1rem 0 .4rem;color:var(--text);letter-spacing:-.01em}
.editor-area h3{font-size:16px;font-weight:600;margin:.875rem 0 .3rem;color:var(--text)}
.editor-area p{margin-bottom:.7rem}
.editor-area ul,.editor-area ol{margin:.4rem 0 .7rem 1.5rem}
.editor-area li{margin-bottom:.25rem}
.editor-area blockquote{border-left:3px solid var(--accent);margin:.8rem 0;padding:.5rem 1rem;color:var(--text2);font-style:italic;background:var(--accent-light);border-radius:0 8px 8px 0}
.editor-area a{color:var(--accent);text-decoration:underline}
.editor-area code{background:var(--surface2);padding:1px 6px;border-radius:5px;font-family:ui-monospace,'Cascadia Code',monospace;font-size:13px;color:var(--text2)}
.editor-area hr{border:none;border-top:1px solid var(--border2);margin:1.5rem 0}
.editor-area[data-placeholder]:empty:before{content:attr(data-placeholder);color:var(--text3);pointer-events:none}

/* INICIO DASHBOARD */
.inicio-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.inicio-wide{grid-column:1/-1}
.inicio-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem}
.inicio-card-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.inicio-card-title span{display:flex;align-items:center;gap:6px}
.hoy-greeting{font-size:22px;font-weight:600;color:var(--text);margin-bottom:3px;letter-spacing:-.02em}
.hoy-date{font-size:12px;color:var(--text3)}
.hoy-stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.hoy-stat{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:var(--radius);padding:7px 12px;border:1px solid var(--border)}
.hoy-stat-num{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-.02em}
.hoy-stat-label{font-size:11px;color:var(--text3)}
.quick-project{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:all .12s}
.quick-project:last-child{border-bottom:none}
.quick-project:hover .quick-project-name{color:var(--accent)}
.quick-project-bar{width:3px;height:28px;border-radius:99px;flex-shrink:0}
.quick-project-name{font-size:13px;font-weight:500;flex:1;color:var(--text)}
.quick-project-pct{font-size:11px;color:var(--text3)}
.mini-progress{height:2px;background:var(--surface3);border-radius:99px;overflow:hidden;width:56px}
.mini-progress-fill{height:100%;background:var(--accent);border-radius:99px}
.idea-recent{font-size:12px;color:var(--text2);padding:6px 9px;background:var(--surface2);border-radius:7px;margin-bottom:4px;line-height:1.45;cursor:pointer;transition:background .12s}
.idea-recent:last-child{margin-bottom:0}
.idea-recent:hover{background:var(--surface3)}
.acceso-rapido{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ar-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px;background:var(--surface2);border-radius:var(--radius-lg);border:1px solid var(--border);cursor:pointer;transition:all .15s;text-decoration:none;font-family:inherit}
.ar-btn:hover{background:var(--accent-light);border-color:var(--accent)}
.ar-btn .icon{font-size:20px;color:var(--accent)}
.ar-btn span{font-size:11px;font-weight:500;color:var(--text2)}
.alerta-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--radius);margin-bottom:4px;cursor:pointer;transition:background .12s}
.alerta-item:last-child{margin-bottom:0}
.alerta-item.alerta-error{background:var(--red-light);color:var(--red)}
.alerta-item.alerta-warn{background:#FEF3C7;color:#92400E}
.alerta-item.alerta-error:hover{background:#ffd7d7}
.alerta-item.alerta-warn:hover{background:#FDE68A}
/* TAREAS */
.task-list{display:flex;flex-direction:column;gap:4px}
.task-item{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .12s}
.task-item:hover{border-color:var(--border2)}
.task-item.done{opacity:.45}
.task-check{width:16px;height:16px;border-radius:4px;border:1px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;background:none}
.task-check:hover{border-color:var(--accent)}
.task-check.checked{background:var(--accent);border-color:var(--accent)}
.task-check.checked::after{content:'✓';color:#fff;font-size:10px;font-weight:700}
.task-text{font-size:13px;flex:1;color:var(--text)}
.task-item.done .task-text{text-decoration:line-through;color:var(--text3)}
.task-phase-tag{font-size:10px;font-weight:500;color:var(--text3);background:var(--surface2);padding:1px 7px;border-radius:99px}
.task-add-wrap{display:flex;gap:6px;margin-top:8px}
.task-add-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .12s}
.task-add-input:focus{border-color:var(--accent)}
/* FOCUS MODE */
.focus-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;animation:fadeUp .18s ease}
.focus-topbar{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.75rem;border-bottom:1px solid var(--border);background:var(--surface)}
.focus-title{font-size:18px;font-weight:600;letter-spacing:-.02em}
.focus-content{flex:1;overflow-y:auto;padding:1.75rem;max-width:680px;margin:0 auto;width:100%}
/* DIARIO */
.diario-layout{display:grid;grid-template-columns:196px 1fr;gap:18px;align-items:start}
.diario-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.875rem;position:sticky;top:80px}
.diario-entry-item{padding:7px 9px;border-radius:var(--radius);cursor:pointer;transition:background .12s;border-left:2px solid transparent}
.diario-entry-item:hover{background:var(--surface2)}
.diario-entry-item.active{background:var(--accent-light);border-left-color:var(--accent)}
.diario-entry-date{font-size:12px;font-weight:600;color:var(--text)}
.diario-entry-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diario-editor{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem 2.5rem;min-height:480px}
.diario-entry-title{font-size:22px;font-weight:600;color:var(--text);margin-bottom:1.25rem;border:none;outline:none;width:100%;background:none;letter-spacing:-.02em;font-family:inherit}
.diario-textarea{width:100%;background:none;border:none;outline:none;font-size:14px;line-height:1.75;color:var(--text);font-family:inherit;resize:none;min-height:380px}
.diario-textarea::placeholder{color:var(--text3)}
/* METAS */
.metas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.meta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.4rem;transition:border-color .12s}
.meta-card:hover{border-color:var(--border2)}
.meta-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.meta-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meta-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.3}
.meta-desc{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:10px}
.meta-period{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:2px 8px;border-radius:2px;letter-spacing:.05em;text-transform:uppercase}
.meta-period-trimestral{background:var(--blue-light);color:var(--blue-dark)}
.meta-period-anual{background:var(--purple-light);color:var(--purple-text)}
.meta-period-mensual{background:var(--green-light);color:var(--green)}
.meta-progress-wrap{margin:10px 0}
.meta-progress-bar{height:4px;background:var(--surface4);border-radius:2px;overflow:hidden}
.meta-progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meta-progress-label{font-size:11px;color:var(--text3);margin-top:4px;display:flex;justify-content:space-between}
.meta-linked{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.meta-linked-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all .15s}
.meta-linked-tag:hover{background:var(--accent);color:#fff}
/* PLANTILLAS */
.plantilla-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;cursor:pointer;transition:border-color .12s}
.plantilla-card:hover{border-color:var(--accent)}
/* BIBLIOTECA */
.bib-layout{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.bib-sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;position:sticky;top:80px}
.bib-cat-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);font-size:13px;color:var(--text3);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.bib-cat-item:hover{background:var(--surface4);color:var(--text)}
.bib-cat-item.active{background:var(--surface4);color:var(--text);font-weight:500}
.bib-cat-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;background:var(--surface3);color:var(--text3);padding:1px 6px;border-radius:2px}
.bib-cat-item.active .bib-cat-count{background:var(--accent-glow);color:var(--accent-dark)}
.bib-sep{height:1px;background:var(--border);margin:8px 0}
.bib-collection-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.bib-collection-item:hover{background:var(--surface2);color:var(--text)}
.bib-collection-item.active{color:var(--accent);font-weight:500}
.bib-main{}
.bib-topbar{display:flex;gap:8px;margin-bottom:1.25rem;align-items:center;flex-wrap:wrap}
.bib-search{flex:1;min-width:180px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px 9px 38px;font-size:13px;color:var(--text);font-family:inherit;outline:none;transition:border-color .12s;position:relative}
.bib-search:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.bib-search-wrap{position:relative;flex:1}
.bib-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:15px;pointer-events:none}
.bib-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center}
.bib-filter-chip{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:4px 12px;border-radius:2px;border:1px solid var(--border2);background:none;color:var(--text3);cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .12s}
.bib-filter-chip.active,.bib-filter-chip:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent-dark)}
.bib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.bib-list{display:flex;flex-direction:column;gap:8px}

/* BIB CARDS */
.bib-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;cursor:pointer;transition:border-color .12s;position:relative;display:flex;flex-direction:column;gap:8px}
.bib-card:hover{border-color:var(--border2)}
.bib-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bib-card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.bib-card-title{font-size:14px;font-weight:600;color:var(--text);flex:1;line-height:1.3}
.bib-card-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0}
.bib-card:hover .bib-card-actions{opacity:1}
.bib-card-desc{font-size:12px;color:var(--text2);line-height:1.55}
.bib-card-prompt{font-size:12px;color:var(--text2);line-height:1.6;background:var(--surface2);border-radius:8px;padding:8px 10px;border-left:3px solid var(--accent);font-family:monospace;white-space:pre-wrap;word-break:break-word;max-height:90px;overflow:hidden;position:relative}
.bib-card-prompt.expanded{max-height:none}
.bib-card-prompt-fade{position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent,var(--surface2));border-radius:0 0 8px 8px}
.bib-card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bib-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:1px 6px;border-radius:2px;letter-spacing:.05em;text-transform:uppercase}
.bib-badge-herramienta{background:var(--blue-light);color:var(--blue-dark)}
.bib-badge-prompt{background:var(--purple-light);color:var(--purple-text)}
.bib-badge-pagina{background:var(--green-light);color:var(--green)}
.bib-badge-snippet{background:var(--amber-light);color:var(--amber-dark)}
.bib-badge-recurso{background:var(--teal-light);color:var(--teal)}
.bib-badge-inspiracion{background:var(--teal-light);color:var(--teal)}
.bib-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:1px 7px;border-radius:2px;background:var(--surface3);color:var(--text3);border:1px solid var(--border)}
.bib-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bib-price{font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px}
.bib-price-free{background:var(--green-light);color:var(--green)}
.bib-price-freemium{background:var(--amber-light);color:var(--amber-dark)}
.bib-price-paid{background:var(--red-light);color:var(--red-dark)}
.bib-copy-btn{background:var(--accent-light);color:var(--accent-dark);border:none;border-radius:var(--radius);padding:5px 10px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .12s;white-space:nowrap}
.bib-copy-btn:hover{background:var(--accent);color:#fff}
.bib-copy-btn.copied{background:var(--green-light);color:var(--green-dark)}
.bib-fav-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:3px;border-radius:6px;transition:all .15s;line-height:1}
.bib-fav-btn:hover{opacity:.75}
.bib-var{background:var(--accent-light);color:var(--accent);border-radius:3px;padding:0 3px;font-weight:600}

/* BIB COLLECTIONS */
.bib-collections-wrap{margin-bottom:1.5rem}
.bib-collection-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border2);background:none;color:var(--text2);font-family:inherit}
.bib-collection-badge.active,.bib-collection-badge:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}

/* DETAIL PANEL */
.bib-detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:150;backdrop-filter:blur(3px);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bib-detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:95vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slideInRight .2s ease;z-index:151;overflow:hidden}
@keyframes slideInRight{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.bib-detail-head{padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--border);flex-shrink:0}
.bib-detail-body{flex:1;overflow-y:auto;padding:1.5rem}
.bib-detail-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.bib-prompt-full{background:var(--surface2);border-radius:var(--radius);padding:1rem;font-size:13px;font-family:monospace;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;border-left:3px solid var(--accent)}
.bib-model-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--text2)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border2)}

/* NAV ACCORDION */
.ni{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;color:var(--text3);font-size:14px;transition:all .12s;user-select:none;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.ni:hover,.ni.on{background:var(--surface4);color:var(--text)}
.ni.on{font-weight:500}
.ns{font-size:13px;padding:5px 8px;cursor:pointer;color:var(--text3);border-radius:3px;transition:all .12s;display:block;user-select:none;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.ns:hover{color:var(--text);background:rgba(255,255,255,.04)}
.ns.on{color:var(--accent-dark);font-weight:500}
.acc-b{overflow:hidden;transition:max-height .25s ease;max-height:0;margin-left:18px;padding-left:10px;border-left:2px solid var(--accent)}
.acc-b.open{max-height:300px}
.acc-b .nav-count{margin-left:auto}

/* MOBILE OVERLAY + SIDEBAR CLOSE */
#mob-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:150;backdrop-filter:blur(2px)}
#mob-overlay.open{display:block}
#mob-sidebar-close{display:none;margin-left:auto;width:28px;height:28px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text3);cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s}
#mob-sidebar-close:hover{background:var(--surface3);color:var(--text)}

/* MOBILE HAMBURGER */
#mob-ham{display:none;width:36px;height:36px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text3);cursor:pointer;flex-shrink:0;transition:all .12s}
#mob-ham:hover{background:var(--surface3);color:var(--text)}

/* MOBILE BOTTOM NAV */
#mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:var(--surface);border-top:1px solid var(--border);z-index:100;align-items:stretch;justify-content:space-around;padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0)}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:transparent;border:none;color:var(--text3);font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;padding:0;transition:color .12s}
.mob-nav-btn .icon{font-size:21px;transition:color .12s}
.mob-nav-btn:hover,.mob-nav-btn.on{color:var(--text)}
.mob-nav-btn.on .icon{color:var(--accent)}
.mob-nav-cap{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent)!important;color:#fff!important;align-self:center;box-shadow:0 0 0 6px rgba(94,106,210,.15)}
.mob-nav-cap .icon{font-size:24px;color:#fff!important}

/* PROFILE DROPDOWN */
.prf-w{position:relative}
.prf-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;cursor:pointer;font-family:'Geist',sans-serif;user-select:none}
.pdd{position:absolute;top:40px;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);width:196px;box-shadow:var(--shadow-lg);z-index:400;display:none;overflow:hidden}
.pdd.open{display:block;animation:popIn .12s ease}
.pdi{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;transition:background .1s;color:var(--text)}
.pdi:hover{background:var(--surface3)}
.pdi .icon{font-size:16px;color:var(--text3)}
.pd-sep{height:1px;background:var(--border);margin:2px 0}
.nb-w{position:relative;display:inline-flex}
.nb-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}

/* MODAL OVERLAY BASE */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center}
.ov.open{display:flex}
.mb{background:var(--surface);border:1px solid var(--border2);border-radius:6px;box-shadow:0 28px 64px rgba(0,0,0,.6);animation:mbIn .18s ease}
@keyframes mbIn{from{opacity:0;transform:scale(.95) translateY(-8px)}to{opacity:1;transform:none}}

/* QUICK CAPTURE */
#cap-modal .mb{width:540px;max-width:94vw;overflow:hidden}
.cap-accent{height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-dark))}
.cap-body{padding:22px 24px 8px}
.cap-icon-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--text3);font-size:12px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.cap-icon-row .icon{font-size:15px;color:var(--accent)}
.cap-in{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:22px;font-family:'Geist',sans-serif;font-weight:500;line-height:1.35;letter-spacing:-.3px;caret-color:var(--accent);padding:0;margin-bottom:12px}
.cap-in::placeholder{color:var(--text3)}
.cap-sep{height:1px;background:var(--border);margin:0 -24px;opacity:.5}
.cap-ta{width:100%;background:transparent;border:none;outline:none;color:var(--text2);font-size:13.5px;font-family:'Geist',sans-serif;line-height:1.7;resize:none;min-height:60px;max-height:140px;padding:12px 0 4px;caret-color:var(--accent)}
.cap-ta::placeholder{color:var(--text3)}
.cap-spaces{display:flex;gap:6px;padding:14px 24px 16px;flex-wrap:wrap}
.cap-space{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:all .14s;background:var(--surface2);color:var(--text3);font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
.cap-space:hover{border-color:var(--border2);background:var(--surface3);color:var(--text)}
.cap-space.on{border-color:var(--accent);background:var(--accent-light);color:var(--accent-dark)}
.cap-space .icon{font-size:18px;transition:color .14s}
.cap-space.on .icon{color:var(--accent)}
.cap-fields-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cap-fields-row .form-select,.cap-fields-row input[type=text],.cap-fields-row input[type=date],.cap-fields-row input[type=number]{flex:1;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-size:12px;font-family:'Geist',sans-serif;outline:none;transition:border-color .12s}
.cap-fields-row .form-select:focus,.cap-fields-row input:focus{border-color:var(--accent)}
.cap-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 24px 14px}
.cap-hints{display:flex;gap:14px}
.cap-hint{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.cap-kbd{background:var(--surface3);border:1px solid var(--border2);border-radius:3px;padding:1px 5px;font-size:10px;color:var(--text2)}
.cap-submit{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:var(--radius);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .12s}
.cap-submit:hover{opacity:.88}
.cap-submit .icon{font-size:14px}

/* GLOBAL SEARCH MODAL */
#search-modal .mb{width:560px;max-width:94vw}
.sh-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
#ci{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-family:'Geist',sans-serif}
#sr{max-height:380px;overflow-y:auto;padding:4px 0}
.sg{padding:6px 18px 2px;font-size:10px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-top:4px}
.si2{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;transition:background .1s}
.si2:hover{background:var(--surface3)}
.si2 .icon{color:var(--text3);font-size:18px}

/* TOPBAR SEARCH */
#hdr-search input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 38px 6px 30px;font-size:13px;color:var(--text);width:220px;outline:none;font-family:'Geist',sans-serif;cursor:pointer;transition:border-color .12s}
#hdr-search input:hover{border-color:var(--border2)}

@media(max-width:768px){
  #sidebar{transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:200}
  #sidebar.mob-open{transform:translateX(0);box-shadow:4px 0 40px rgba(0,0,0,.7)}
  #mob-sidebar-close{display:flex!important}
  .main{margin-left:0!important}
  #mob-ham{display:flex!important}
  .topbar{padding:.625rem 1rem}
  #hdr-search{display:none}
  .content{padding:1rem .875rem;padding-bottom:76px}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1.25rem}
  .kanban-board{grid-template-columns:1fr}
  .brief-grid{grid-template-columns:1fr}
  .inicio-grid{grid-template-columns:1fr}
  .diario-layout{grid-template-columns:1fr}
  .diario-sidebar{position:static;top:auto}
  .bib-layout{grid-template-columns:1fr}
  .bib-sidebar{display:none}
  .detail-stats{grid-template-columns:repeat(2,1fr)}
  .form-row{grid-template-columns:1fr}
  .acceso-rapido{grid-template-columns:repeat(2,1fr)}
  .metas-grid{grid-template-columns:1fr}
  .editor-area{padding:1rem .875rem;min-height:320px}
  .diario-editor{padding:1rem .875rem}
  .bib-detail-panel{width:100%;max-width:100%}
  .detail-tabs{flex-wrap:wrap;width:100%}
  .editor-toolbar{top:52px}
  .modal{padding:1.25rem;width:calc(100% - 2rem)}
  .phase-doc-topbar{flex-direction:column;align-items:flex-start;gap:8px}
  .phase-doc-topbar>div{flex-wrap:wrap;gap:6px}
  #mob-nav{display:flex!important}
  .cap-hints{display:none}
}
@media(max-width:480px){
  .btn-label{display:none}
  .stat-value{font-size:20px}
  .hoy-greeting{font-size:18px}
  .content{padding:.875rem .75rem;padding-bottom:76px}
  .topbar{padding:.5rem .75rem}
}
/* ═══ UNIVERSITY ═══ */
.nota-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:2px 8px;border-radius:2px;display:inline-block}
.nota-good{background:var(--green-light);color:var(--green-dark)}
.nota-ok{background:var(--amber-light);color:var(--amber-dark)}
.nota-fail{background:var(--red-light);color:var(--red-dark)}
.nota-na{background:var(--surface3);color:var(--text3)}
.eval-list{display:flex;flex-direction:column;gap:6px}
.eval-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;display:flex;align-items:center;gap:10px;transition:border-color .12s}
.eval-item:hover{border-color:var(--border2)}
.eval-item:hover .card-menu{opacity:1}
.eval-body{flex:1;min-width:0}
.eval-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.eval-meta{font-size:11px;color:var(--text3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.uni-cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.uni-cal-dayname{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);text-align:center;padding:4px 2px;text-transform:uppercase;letter-spacing:.04em}
.uni-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:1.5rem}
.uni-cal-cell{min-height:68px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:5px 6px}
.uni-cal-cell.other-month{opacity:.28}
.uni-cal-cell.today{border-color:var(--accent)}
.uni-cal-num{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3);margin-bottom:3px}
.uni-cal-cell.today .uni-cal-num{color:var(--accent);font-weight:700}
.cal-evt{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 5px;border-radius:2px;margin-bottom:2px;line-height:1.5;cursor:pointer}
.cal-evt.prueba{background:var(--red-light);color:var(--red-dark)}
.cal-evt.trabajo{background:var(--blue-light);color:var(--blue-dark)}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .12s;flex-shrink:0}
.color-dot.selected{border-color:var(--text)!important}
/* ═══ FINANZAS ═══ */
.trans-list{display:flex;flex-direction:column;gap:6px}
.trans-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:12px;transition:border-color .12s}
.trans-item:hover{border-color:var(--border2)}
.trans-item:hover .card-menu{opacity:1}
.trans-icon{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trans-icon.ingreso{background:var(--green-light);color:var(--green)}
.trans-icon.gasto{background:var(--red-light);color:var(--red)}
.trans-body{flex:1;min-width:0}
.trans-nombre{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trans-cat{font-size:11px;color:var(--text3)}
.trans-monto{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;flex-shrink:0;text-align:right}
.trans-monto.ingreso{color:var(--green)}
.trans-monto.gasto{color:var(--red)}
/* ═══ GIMNASIO ═══ */
.rutinas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:1.5rem}
.rutina-card{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-left-color:var(--amber);border-radius:var(--radius);padding:1rem 1.2rem;transition:border-color .12s}
.rutina-card:hover{border-color:var(--border2)}
.rutina-card:hover .card-menu{opacity:1}
.ejercicio-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.ejercicio-row:last-child{border-bottom:none}
.gym-log-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.gym-log-item:last-child{border-bottom:none}
/* ═══ ESPACIO LIBRE ═══ */
.espacio-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 140px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.espacio-sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.espacio-nota-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.espacio-nota-item:hover{background:var(--surface3)}
.espacio-nota-item.active{background:var(--surface3)}
.espacio-nota-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.espacio-nota-date{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.espacio-editor{display:flex;flex-direction:column;background:var(--bg)}
.espacio-title-in{background:none;border:none;outline:none;font-size:18px;font-weight:600;color:var(--text);font-family:'Geist',sans-serif;padding:1.25rem 1.5rem .5rem;width:100%;letter-spacing:-.02em}
.espacio-ta{flex:1;background:none;border:none;outline:none;padding:.5rem 1.5rem 1.5rem;font-size:13px;color:var(--text2);font-family:'Geist',sans-serif;line-height:1.75;resize:none;min-height:300px;width:100%}
@media(max-width:768px){
  .espacio-layout{grid-template-columns:1fr}
  .espacio-sidebar{display:none}
  .uni-cal-grid{grid-template-columns:repeat(7,1fr)}
  .rutinas-grid{grid-template-columns:1fr}
}

<body>
<div id="mob-overlay" onclick="closeMobSidebar()"></div>
<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">DP</div>
        <div>
          <div class="logo-text">Dieguinni's <span>Projects</span></div>
          <div class="logo-sub">workspace personal</div>
        </div>
      </div>
      <button id="mob-sidebar-close" onclick="closeMobSidebar()"><span class="icon" style="font-size:16px">close</span></button>
    </div>

<script src="sql-asm.js"></script>
<script>
// ───── SQLite storage layer ─────
let _sqldb=null;
let _SQL=null;
let _fileHandle=null;
let _idbDb=null;
let _persistTimer=null;
let _connectionStatus='disconnected';

function openIDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('prohub_storage',1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
function idbGet(key){
  return new Promise((resolve,reject)=>{
    const tx=_idbDb.transaction('kv','readonly');
    const req=tx.objectStore('kv').get(key);
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
function idbSet(key,value){
  return new Promise((resolve,reject)=>{
    const tx=_idbDb.transaction('kv','readwrite');
    tx.objectStore('kv').put(value,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e.target.error);
  });
}
function ensureSchema(){
  _sqldb.run(`
    CREATE TABLE IF NOT EXISTS projects (id TEXT PRIMARY KEY, name TEXT, category TEXT, status TEXT, priority TEXT, data TEXT, updated_at TEXT);
    CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT);
    CREATE TABLE IF NOT EXISTS diario (id TEXT PRIMARY KEY, date TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS metas (id TEXT PRIMARY KEY, titulo TEXT, periodo TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS plantillas (id TEXT PRIMARY KEY, nombre TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS bib_items (id TEXT PRIMARY KEY, type TEXT, title TEXT, "collection" TEXT, fav INTEGER, data TEXT);
    CREATE TABLE IF NOT EXISTS bib_collections (name TEXT PRIMARY KEY, position INTEGER DEFAULT 0);
    CREATE TABLE IF NOT EXISTS uni_ramos (id TEXT PRIMARY KEY, nombre TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS uni_pruebas (id TEXT PRIMARY KEY, ramo_id TEXT, nombre TEXT, fecha TEXT, nota REAL, data TEXT);
    CREATE TABLE IF NOT EXISTS uni_trabajos (id TEXT PRIMARY KEY, ramo_id TEXT, nombre TEXT, fecha_entrega TEXT, estado TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS fin_transacciones (id TEXT PRIMARY KEY, tipo TEXT, monto REAL, categoria TEXT, fecha TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS gym_rutinas (id TEXT PRIMARY KEY, nombre TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS gym_registros (id TEXT PRIMARY KEY, rutina_id TEXT, fecha TEXT, data TEXT);
    CREATE TABLE IF NOT EXISTS espacio_notas (id TEXT PRIMARY KEY, titulo TEXT, contenido TEXT, updated_at TEXT);
  `);
}
function _query(sql,params){
  const stmt=_sqldb.prepare(sql);
  if(params&&params.length)stmt.bind(params);
  const rows=[];
  while(stmt.step())rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}
function _insertProject(p){
  _sqldb.run('INSERT OR REPLACE INTO projects VALUES (?,?,?,?,?,?,?)',
    [p.id,p.name||'',p.category||'',p.status||'',p.priority||'',JSON.stringify(p),new Date().toISOString()]);
}
function _insertDiario(d){
  _sqldb.run('INSERT OR REPLACE INTO diario VALUES (?,?,?)',[d.id,d.date||'',JSON.stringify(d)]);
}
function _insertMeta(m){
  _sqldb.run('INSERT OR REPLACE INTO metas VALUES (?,?,?,?)',[m.id,m.titulo||'',m.periodo||'',JSON.stringify(m)]);
}
function _insertPlantilla(p){
  _sqldb.run('INSERT OR REPLACE INTO plantillas VALUES (?,?,?)',[p.id,p.nombre||'',JSON.stringify(p)]);
}
function _insertBibItem(it){
  _sqldb.run('INSERT OR REPLACE INTO bib_items VALUES (?,?,?,?,?,?)',
    [it.id,it.type||'',it.title||'',it.collection||'',it.fav?1:0,JSON.stringify(it)]);
}
function _insertUniRamo(r){_sqldb.run('INSERT OR REPLACE INTO uni_ramos VALUES(?,?,?)',[r.id,r.nombre||'',JSON.stringify(r)]);}
function _insertUniPrueba(p){_sqldb.run('INSERT OR REPLACE INTO uni_pruebas VALUES(?,?,?,?,?,?)',[p.id,p.ramo_id||'',p.nombre||'',p.fecha||'',p.nota!=null?parseFloat(p.nota):null,JSON.stringify(p)]);}
function _insertUniTrabajo(t){_sqldb.run('INSERT OR REPLACE INTO uni_trabajos VALUES(?,?,?,?,?,?)',[t.id,t.ramo_id||'',t.nombre||'',t.fecha_entrega||'',t.estado||'pendiente',JSON.stringify(t)]);}
function _insertFinTrans(t){_sqldb.run('INSERT OR REPLACE INTO fin_transacciones VALUES(?,?,?,?,?,?)',[t.id,t.tipo||'',parseFloat(t.monto)||0,t.categoria||'',t.fecha||'',JSON.stringify(t)]);}
function _insertGymRutina(r){_sqldb.run('INSERT OR REPLACE INTO gym_rutinas VALUES(?,?,?)',[r.id,r.nombre||'',JSON.stringify(r)]);}
function _insertGymRegistro(r){_sqldb.run('INSERT OR REPLACE INTO gym_registros VALUES(?,?,?,?)',[r.id,r.rutina_id||'',r.fecha||'',JSON.stringify(r)]);}
function _insertEspacioNota(n){_sqldb.run('INSERT OR REPLACE INTO espacio_notas VALUES(?,?,?,?)',[n.id,n.titulo||'',n.contenido||'',n.updated_at||'']);}
function seedDefaults(){
  defaultProjects().forEach(_insertProject);
  defaultPlantillas().forEach(_insertPlantilla);
  defaultBibItems().forEach(_insertBibItem);
  ['Stack IA','Diseño','Productividad'].forEach((c,i)=>
    _sqldb.run('INSERT OR REPLACE INTO bib_collections VALUES (?,?)',[c,i]));
  _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',['layoutView',JSON.stringify('grid')]);
}
function migrateFromLocalStorage(){
  let migrated=false;
  try{
    const raw=localStorage.getItem('prohub_v3');
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed.projects&&Array.isArray(parsed.projects)){
        parsed.projects.forEach(_insertProject);
        if(parsed.settings){
          for(const [k,v] of Object.entries(parsed.settings))
            _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',[k,JSON.stringify(v)]);
        }
        migrated=true;
      }
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem('prohub_extras_v1');
    if(raw){
      const parsed=JSON.parse(raw);
      (parsed.diario||[]).forEach(_insertDiario);
      (parsed.metas||[]).forEach(_insertMeta);
      (parsed.plantillas||[]).forEach(_insertPlantilla);
      migrated=true;
    }
  }catch(e){}
  try{
    const raw=localStorage.getItem('prohub_bib_v1');
    if(raw){
      const parsed=JSON.parse(raw);
      (parsed.items||[]).forEach(_insertBibItem);
      (parsed.collections||[]).forEach((c,i)=>
        _sqldb.run('INSERT OR REPLACE INTO bib_collections VALUES (?,?)',[c,i]));
      migrated=true;
    }
  }catch(e){}
  return migrated;
}
async function initStorage(){
  _idbDb=await openIDB();
  _SQL=await initSqlJs();
  try{
    const handle=await idbGet('fileHandle');
    if(handle){
      const perm=await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted')_fileHandle=handle;
    }
  }catch(e){}
  let bytes=null;
  if(_fileHandle){
    try{
      const f=await _fileHandle.getFile();
      bytes=new Uint8Array(await f.arrayBuffer());
      _connectionStatus='connected';
    }catch(e){_fileHandle=null;}
  }
  if(!bytes){
    try{bytes=await idbGet('dbBytes');}catch(e){}
    if(bytes&&bytes.byteLength>0&&!_fileHandle)_connectionStatus='cached';
  }
  if(bytes&&bytes.byteLength>0){
    _sqldb=new _SQL.Database(bytes);
    ensureSchema();
  }else{
    _sqldb=new _SQL.Database();
    ensureSchema();
    const migrated=migrateFromLocalStorage();
    if(!migrated)seedDefaults();
    else setTimeout(()=>notif('Datos migrados desde localStorage ✓'),800);
  }
}
function load(){
  const projects=_query('SELECT data FROM projects ORDER BY updated_at DESC').map(r=>JSON.parse(r.data));
  const settings={};
  for(const r of _query('SELECT key, value FROM settings')){
    try{settings[r.key]=JSON.parse(r.value);}catch(e){}
  }
  return{projects,settings};
}
function save(d){
  if(!_sqldb)return;
  _sqldb.run('BEGIN');
  try{
    _sqldb.run('DELETE FROM projects');
    (d.projects||[]).forEach(_insertProject);
    _sqldb.run('DELETE FROM settings');
    for(const [k,v] of Object.entries(d.settings||{}))
      _sqldb.run('INSERT OR REPLACE INTO settings VALUES (?,?)',[k,JSON.stringify(v)]);
    _sqldb.run('COMMIT');
  }catch(e){_sqldb.run('ROLLBACK');throw e;}
  schedulePersist();
}
function schedulePersist(){
  clearTimeout(_persistTimer);
  _persistTimer=setTimeout(persistNow,300);
}
async function persistNow(){
  if(!_sqldb)return;
  try{
    const bytes=_sqldb.export();
    await idbSet('dbBytes',bytes);
    if(_fileHandle){
      try{
        const writable=await _fileHandle.createWritable();
        await writable.write(bytes);
        await writable.close();
        if(_connectionStatus!=='connected'){
          _connectionStatus='connected';
          updateConnectionUI();
        }
      }catch(e){
        _fileHandle=null;
        _connectionStatus='cached';
        updateConnectionUI();
        notif('No se pudo escribir el archivo .db — guardando solo en caché');
      }
    }
  }catch(e){console.error('Persist failed',e);}
}
async function connectDbFile(){
  if(!_SQL){notif('Cargando base de datos, espera un momento…');return;}
  if(!('showOpenFilePicker' in window)){
    notif('Tu navegador no soporta acceso directo. Usa Chrome/Edge o el botón "Importar .db".');
    return;
  }
  try{
    const [h]=await window.showOpenFilePicker({
      types:[{description:'SQLite database',accept:{'application/x-sqlite3':['.db','.sqlite','.sqlite3']}}]
    });
    const perm=await h.requestPermission({mode:'readwrite'});
    if(perm!=='granted')return notif('Permiso denegado');
    const f=await h.getFile();
    const bytes=new Uint8Array(await f.arrayBuffer());
    if(bytes.byteLength>0){
      _sqldb=new _SQL.Database(bytes);
      ensureSchema();
    }
    _fileHandle=h;
    try{await idbSet('fileHandle',h);}catch(e){}
    _connectionStatus='connected';
    db=load();extras=loadExtras();bib=loadBib();uni=loadUni();personal=loadPersonal();
    layoutView=db.settings?.layoutView||'grid';
    updateConnectionUI();updateProfileName();render();
    notif('Conectado a '+h.name+' ✓');
    schedulePersist();
  }catch(e){
    if(e.name!=='AbortError')notif('Error al conectar: '+e.message);
  }
}
async function saveDbAs(){
  if(!_sqldb){notif('Cargando base de datos, espera un momento…');return;}
  if(!('showSaveFilePicker' in window)){
    downloadDbFile();
    return;
  }
  try{
    const h=await window.showSaveFilePicker({
      suggestedName:'prohub.db',
      types:[{description:'SQLite database',accept:{'application/x-sqlite3':['.db']}}]
    });
    _fileHandle=h;
    try{await idbSet('fileHandle',h);}catch(e){}
    _connectionStatus='connected';
    updateConnectionUI();
    await persistNow();
    notif('Guardado como '+h.name+' ✓');
  }catch(e){
    if(e.name!=='AbortError')notif('Error al guardar: '+e.message);
  }
}
function downloadDbFile(){
  if(!_sqldb)return;
  const bytes=_sqldb.export();
  const blob=new Blob([bytes],{type:'application/x-sqlite3'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='prohub-'+new Date().toISOString().slice(0,10)+'.db';
  a.click();
  notif('Descargado ✓');
}
function importDbFile(input){
  if(!_SQL){notif('Cargando base de datos, espera un momento…');input.value='';return;}
  const file=input.files[0];
  if(!file)return;
  if(!confirm('¿Reemplazar la base de datos actual con '+file.name+'?')){input.value='';return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const bytes=new Uint8Array(e.target.result);
      _sqldb=new _SQL.Database(bytes);
      ensureSchema();
      db=load();extras=loadExtras();bib=loadBib();uni=loadUni();personal=loadPersonal();
      layoutView=db.settings?.layoutView||'grid';
      schedulePersist();render();
      notif('Base de datos importada ✓');
    }catch(err){notif('Error: archivo .db inválido');}
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}
async function disconnectDbFile(){
  _fileHandle=null;
  try{await idbSet('fileHandle',null);}catch(e){}
  _connectionStatus='cached';
  updateConnectionUI();
  notif('Desconectado — datos solo en caché del navegador');
}
function updateConnectionUI(){
  const el=document.getElementById('db-status');
  if(el){
    if(_connectionStatus==='connected'){
      const name=_fileHandle?.name||'prohub.db';
      el.innerHTML=`<span class="icon" style="color:var(--green);font-size:16px">database</span><span style="color:var(--green);font-weight:500">${name}</span>`;
      el.title='Cambios guardados automáticamente al archivo';
    }else if(_connectionStatus==='cached'){

function renderTimeline(){
  const projects=db.projects.filter(p=>p.deadline);
  if(!projects.length)return`<div class="empty"><span class="icon" style="font-size:52px;display:block;margin-bottom:16px;opacity:.4">timeline</span><p>Ningún proyecto tiene fecha límite asignada.</p></div>`;
  const dates=projects.flatMap(p=>[new Date(p.deadline)]);
  const minDate=new Date(Math.min(...projects.map(p=>new Date(p.deadline))));
  const maxDate=new Date(Math.max(...dates));
  minDate.setDate(1); maxDate.setMonth(maxDate.getMonth()+1); maxDate.setDate(1);
  const totalDays=(maxDate-minDate)/(1000*60*60*24);
  const months=[];
  let d=new Date(minDate);
  while(d<maxDate){months.push(new Date(d));d.setMonth(d.getMonth()+1)}
  const monthW=Math.max(60,Math.floor(700/months.length));
  const colors=['#1D9E75','#534AB7','#185FA5','#854F0B','#993C1D','#3B6D11'];
  const hdrs=months.map(m=>`<div class="timeline-month" style="width:${monthW}px">${m.toLocaleDateString('es-CL',{month:'short',year:'2-digit'})}</div>`).join('');
  const today=new Date();
  const todayPct=totalDays>0?Math.max(-1,Math.min(101,(today-minDate)/(maxDate-minDate)*100)):-1;
  const todayInRange=todayPct>=0&&todayPct<=100;
  const todayLine=todayInRange?`<div style="position:absolute;left:${todayPct.toFixed(1)}%;top:0;bottom:0;width:1px;background:var(--red);opacity:.6;pointer-events:none;z-index:2"></div>`:'';
  const rows=projects.map((p,i)=>{
    const end=new Date(p.deadline+'T00:00:00');
    const start=new Date(end);start.setMonth(start.getMonth()-Math.max(1,p.phases.length));
    const s=Math.max(0,(start-minDate)/(maxDate-minDate)*100);
    const e=Math.min(100,(end-minDate)/(maxDate-minDate)*100);
    const w=Math.max(2,e-s);
    const color=colors[i%colors.length];
    return`<div class="timeline-row">
      <div class="timeline-label" onclick="setView('project-detail','${p.id}')" title="${p.name}">${p.name}</div>
      <div class="timeline-track">
        ${todayLine}
        <div class="timeline-bar" style="left:${s}%;width:${w}%;background:${color}" onclick="setView('project-detail','${p.id}')" title="${p.name} — ${p.deadline}">${p.name}</div>
      </div>
    </div>`;
  }).join('');
  const todayHdr=todayInRange?`<div style="position:absolute;left:${todayPct.toFixed(1)}%;top:50%;transform:translate(-50%,-50%);font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--red);background:var(--surface);border:1px solid var(--red);padding:1px 5px;border-radius:2px;opacity:.8;pointer-events:none;z-index:2;white-space:nowrap">HOY</div>`:'';
  return`<div class="timeline-wrap"><div class="timeline-header" style="position:relative">${todayHdr}${hdrs}</div>${rows}</div>`;
}

let _docTimer=null;
function autoSaveDoc(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const editor=document.getElementById('phase-editor');
  if(!editor)return;
  ph.doc=editor.innerHTML;
  save(db);
  clearTimeout(_docTimer);
  const el=document.getElementById('doc-saved');
  if(el){el.classList.add('show');_docTimer=setTimeout(()=>el.classList.remove('show'),1500)}
}

function cyclePhaseInDoc(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  ph.status={pending:'active',active:'completed',completed:'pending'}[ph.status]||'pending';
  save(db);
  // re-render only the meta part without losing editor content
  const content=document.getElementById('phase-editor')?.innerHTML||'';
  render();
  setTimeout(()=>{const ed=document.getElementById('phase-editor');if(ed)ed.innerHTML=content;},30);
}

function execCmd(cmd,val=null){
  document.getElementById('phase-editor')?.focus();
  document.execCommand(cmd,false,val);
}

function insertBlockquote(){
  document.getElementById('phase-editor')?.focus();
  document.execCommand('formatBlock',false,'blockquote');
}

function insertHr(){
  document.getElementById('phase-editor')?.focus();
  document.execCommand('insertHTML',false,'<hr>');
}

function insertLink(){
  const url=prompt('URL del enlace:');
  if(url){document.getElementById('phase-editor')?.focus();document.execCommand('createLink',false,url);}
}

function exportPhaseDoc(pid,phid){
  const p=db.projects.find(pr=>pr.id===pid);
  const ph=p.phases.find(ph=>ph.id===phid);
  const editor=document.getElementById('phase-editor');
  const html=editor?editor.innerHTML:(ph.doc||'');
  // convert basic html to markdown-ish plain text
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const text=tmp.innerText||tmp.textContent||'';
  const full=`# ${ph.name}\n**Proyecto:** ${p.name}\n**Estado:** ${{pending:'Pendiente',active:'En curso',completed:'Completado'}[ph.status]||ph.status}\n${ph.startDate?'**Inicio:** '+ph.startDate:''}${ph.endDate?' **Fin:** '+ph.endDate:''}\n\n---\n\n${text}\n\n---\nExportado el ${new Date().toLocaleDateString('es-CL')}`;
  const blob=new Blob([full],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${p.name}-${ph.name}.txt`.replace(/\s+/g,'-');
  a.click();
  notif('Exportado ✓');
}
